<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2230">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PriceArmor | AR Akron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
/* Κατάστιχο: χαρτί, μελάνι και ορείχαλκος μόνο εκεί που μετράει */
:root{
  --ink:#1C2230; --ink-2:#2B3345; --ink-3:#3A4356;
  --paper:#F6F6F3; --card:#FFFFFF; --text:#1C2230; --muted:#5F6878; --faint:#8D95A3;
  --line:#E4E2DC; --line2:#EFEEEA;
  --brass:#B8862B; --brass-d:#97691A; --brass-soft:#F8F0DF;
  --accent:#1C2230; --accent-d:#000; --accent-soft:#EEF0F4;
  --up:#B42318; --up-soft:#FCEFEC; --down:#227A4B; --down-soft:#EAF5EE; --warn:#8A5A00; --warn-soft:#FFF5DC;
  --r-lg:12px; --r:8px; --r-sm:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font-family:Commissioner,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--ink);text-decoration-color:var(--brass);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Πλαϊνό μενού σε μελάνι */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--ink) 240px,transparent 240px)}
.side{background:var(--ink);color:#C8CDD7;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;flex-direction:column;padding:2px 12px 22px}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em;color:#fff}
.brand b em{font-style:normal;color:var(--brass)}
.brand span{font-size:12px;color:#8E96A6;margin-top:2px}
.nav{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r);border:0;background:none;cursor:pointer;color:#C8CDD7;font-weight:500;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.05);color:#fff}
.nav.on{background:rgba(255,255,255,.08);color:#fff}
.nav.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brass)}
.nav .cnt{margin-left:auto;background:var(--brass);color:var(--ink);font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.scanbtn{margin:0 0 16px;justify-content:center;background:var(--brass);color:var(--ink);font-weight:600;padding:11px 12px}
.scanbtn:hover{background:#C9963A;color:var(--ink)}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#8E96A6}
.side-foot b{display:block;color:#E3E6EC;font-weight:600}

.main{padding:32px 40px 64px;max-width:1200px;width:100%;min-width:0}
.mtop,.bnav{display:none}
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.phead .sp{flex:1}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.2}
h2{font-size:16px;margin:0 0 14px;font-weight:650;letter-spacing:-.005em}
.sub{color:var(--muted);margin:4px 0 22px}
.phead .sub{margin-bottom:0}

/* Επιφάνειες: μία ακτίνα για περιέκτες, μικρότερη για πεδία */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stat .l{color:var(--muted);font-size:13px} .stat .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em} .stat .s{font-size:12.5px;color:var(--faint);margin-top:2px}

/* Λωρίδα βασικών αριθμών: ένα ενιαίο πλαίσιο με διαχωριστικά */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:16px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{padding:16px 20px;border-left:1px solid var(--line2);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.kpi .s{font-size:12.5px;color:var(--faint);margin-top:2px}
.kpi.alert-k .v{color:var(--up)}
.al-hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.al-big{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px}
.al-big .l{font-size:15px;color:var(--muted);font-weight:600}
.al-big .v{font-size:40px;font-weight:750;letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
.al-big.up .v{color:var(--up)} .al-big.down .v{color:var(--down)}
.al-big .s{font-size:14px;color:var(--faint);margin-top:2px}
.al-sum{font-size:16.5px;margin:4px 2px 20px} .al-sum .up{color:var(--up)} .al-sum .down{color:var(--down)}
.al-list{display:grid;gap:10px}
.al-item{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;background:var(--card)}
.al-item.up{border-left-color:var(--up)} .al-item.down{border-left-color:var(--down)} .al-item.new{background:#fffdf5}
.al-item:hover{box-shadow:0 2px 8px rgba(28,34,48,.08)}
.al-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .al-top b{font-size:15.5px}
.al-money{font-weight:700;font-size:17px;white-space:nowrap} .al-item.up .al-money{color:var(--up)} .al-item.down .al-money{color:var(--down)}
.al-line{margin-top:6px;font-size:14.5px;line-height:1.5}
.al-tip{margin-top:8px;font-size:13.5px;background:var(--brass-soft);padding:7px 10px;border-radius:6px;display:inline-block}
@media (max-width:700px){ .al-hero{grid-template-columns:1fr;gap:10px} .al-big{padding:16px 18px} .al-big .v{font-size:32px} }

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:550;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#CFCCC4;background:#FBFBF9}
.btn.p{background:var(--ink);border-color:var(--ink);color:#fff} .btn.p:hover{background:var(--ink-2)}
.btn.g{background:var(--brass);border-color:var(--brass);color:var(--ink)} .btn.g:hover{background:#C9963A}
.btn.d{color:var(--up)} .btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:17px;height:17px}

/* Πίνακες σαν λογιστική στήλη */
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:#FAFAF7}
.r{text-align:right} .nw{white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -20px;padding:0 20px}
.mut{color:var(--muted)} .sm{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:650;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-up{background:var(--up-soft);color:var(--up)} .b-down{background:var(--down-soft);color:var(--down)} .b-eq{background:var(--line2);color:var(--muted)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-acc{background:var(--accent-soft);color:var(--ink)}
.totals td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.money{font-weight:650}

input.in,select.in{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:#fff;width:100%;min-width:0}
input.in:focus,select.in:focus{outline:2px solid var(--brass-soft);border-color:var(--brass)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted);font-weight:500}
.field small{font-size:12px;color:var(--muted)} .field small.err{color:var(--up)}
.field input.invalid{border-color:var(--up);background:#FFFBFA}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fgrid .wide{grid-column:span 2}

/* Φίλτρα περιόδου σαν segmented control */
.chips{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--line2);border-radius:var(--r);padding:3px}
.chip{border:0;background:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:550;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(28,34,48,.12)}

.drop{border:1.5px dashed #CFCCC4;border-radius:var(--r-lg);background:#fff;padding:44px 20px;text-align:center}
.drop.over{border-color:var(--brass);background:var(--brass-soft)}
.drop-t{font-size:17px;font-weight:650;margin-bottom:4px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.thumb{position:relative;width:96px;height:124px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:99px;border:0;background:rgba(28,34,48,.75);color:#fff;cursor:pointer;line-height:1}
.review{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.preview{padding:0;overflow:hidden}.preview summary{padding:14px 20px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}.preview summary svg{width:18px;height:18px}.preview summary::-webkit-details-marker{display:none}.preview summary:after{content:'Απόκρυψη';margin-left:auto;font-weight:500;font-size:13px;color:var(--mut)}.preview:not([open]) summary:after{content:'Εμφάνιση'}.pages{display:flex;gap:12px;overflow-x:auto;padding:0 20px 20px}.pages iframe{width:100%;height:75vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.preview img{max-height:75vh;max-width:100%;width:auto;border-radius:var(--r);border:1px solid var(--line);flex:0 0 auto}
.lines input.in{padding:6px 7px;font-size:14px}
.lines td{padding:5px 4px;border-bottom:1px solid var(--line2)}
.lines th{padding:6px 4px}
.alert{border-radius:var(--r);padding:11px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert.w{background:var(--warn-soft);color:#5C3D00} .alert.e{background:var(--up-soft);color:#7A1A10} .alert.i{background:var(--accent-soft);color:var(--ink)} .alert.ok{background:var(--down-soft);color:#14512F}
.spin{width:38px;height:38px;border:3px solid var(--line2);border-top-color:var(--brass);border-radius:99px;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(28,34,48,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:840px;padding:24px;box-shadow:0 24px 60px rgba(28,34,48,.28)}
.modal.sm{max-width:520px}
.mhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.x{border:0;background:var(--line2);width:34px;height:34px;border-radius:99px;cursor:pointer;font-size:18px;flex:none;color:var(--ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r);font-weight:550;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px} .kv dt{color:var(--muted)} .kv dd{margin:0}
.sup-name{font-weight:600}
.imgs{display:flex;gap:10px;overflow-x:auto} .imgs img{height:220px;border-radius:var(--r);border:1px solid var(--line);cursor:zoom-in}
.mb{margin-bottom:16px} .mt{margin-top:16px}

/* Ομάδες κατηγοριών */
.grps{display:flex;flex-direction:column;gap:8px}
.grp{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.grp>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none;font-weight:600}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover{background:#FAFAF7}
.grp .gc{background:var(--line2);color:var(--muted);font-size:12px;border-radius:99px;padding:1px 8px;font-weight:600}
.grp .chev{color:var(--faint);font-size:20px;transition:transform .15s;margin-left:4px} .grp[open] .chev{transform:rotate(90deg)}
.grp[open]>summary{border-bottom:1px solid var(--line)}
.gbody{padding:0 16px 6px} .gbody .tbl{margin:0 -16px;padding:0 16px}

/* Αρχική: «Τι ακρίβυνε» */
.rise{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.rise:last-child{border-bottom:0}
.rise:hover .rn{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:3px}
.rise .rn{font-weight:600}
.rise .rs{font-size:13px;color:var(--muted)}
.rise .rp{font-size:13.5px;color:var(--muted);text-align:right;white-space:nowrap}
.rise .rp b{color:var(--text)}
.rise .rd{font-size:18px;font-weight:700;color:var(--up);text-align:right;min-width:78px}
.rise .rd small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:22px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:38px;background:#7C879C;border-radius:4px 4px 0 0;min-height:2px}
.bar.cur i{background:var(--brass)}
.bar em{font-style:normal;font-size:11.5px;font-weight:650;margin-bottom:4px;white-space:nowrap}
.bar span{font-size:12px;color:var(--muted);margin-top:6px}
.share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;cursor:pointer}
.share .bg{grid-column:1/-1;height:4px;background:var(--line2);border-radius:4px;overflow:hidden}
.share .bg i{display:block;height:100%;background:var(--ink-3);border-radius:4px}

@media (max-width:1050px){ .g4,.kpis{grid-template-columns:repeat(2,1fr)} .kpi:nth-child(3){border-left:0} .kpi:nth-child(n+3){border-top:1px solid var(--line2)} .fgrid{grid-template-columns:repeat(2,1fr)} .split{grid-template-columns:1fr} .pages iframe{height:60vh} }
@media (max-width:860px){
  .app{grid-template-columns:1fr;background:none} .side{display:none}
  .main{padding:18px 16px 104px}
  .mtop{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
  .mtop .brand{padding:0;flex-direction:row;align-items:baseline;gap:8px}
  .icbtn{position:relative;border:0;background:rgba(255,255,255,.08);color:#fff;width:38px;height:38px;border-radius:99px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .icbtn svg{width:19px;height:19px} .icbtn .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;background:var(--brass);border-radius:99px;border:2px solid var(--ink)}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;padding:4px 0;font-weight:550}
  .bnav button.on{color:var(--ink)} .bnav svg{width:22px;height:22px}
  .bnav .big span.c{background:var(--brass);color:var(--ink);width:50px;height:50px;border-radius:99px;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 16px rgba(184,134,43,.4);border:3px solid #fff}
  .g3,.g2{grid-template-columns:1fr} .fgrid .wide{grid-column:span 2}
  h1{font-size:22px}
  .kpi{padding:13px 14px} .kpi .v{font-size:21px}
  .hide-m{display:none}
  .phead .btn.g{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================
   Βάση δεδομένων (IndexedDB, στη συσκευή)
   ========================================================= */
const DB_NAME = "timologia", DB_VER = 1;
const STORES = ["suppliers", "invoices", "files", "alerts", "meta"];
let _db = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => { const db = r.result; STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: "id" }); }); };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const s = t.objectStore(store);
    const req = fn(s);
    t.oncomplete = () => res(req && "result" in req ? req.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = s => tx(s, "readonly", st => st.getAll());
const dbGet = (s, id) => tx(s, "readonly", st => st.get(id));
const dbPut = (s, v) => tx(s, "readwrite", st => st.put(v));
const dbDel = (s, id) => tx(s, "readwrite", st => st.delete(id));
const dbClear = s => tx(s, "readwrite", st => st.clear());

/* =========================================================
   Βοηθητικά
   ========================================================= */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const EUR = new Intl.NumberFormat("el-GR", { style: "currency", currency: "EUR" });
const N4 = new Intl.NumberFormat("el-GR", { minimumFractionDigits: 2, maximumFractionDigits: 4 });
const N2 = new Intl.NumberFormat("el-GR", { maximumFractionDigits: 3 });
const fmtEur = v => (v == null || isNaN(v)) ? "—" : EUR.format(v);
const fmtPrice = v => (v == null || isNaN(v)) ? "—" : N4.format(v) + " €";
const fmtQty = v => (v == null || isNaN(v)) ? "" : N2.format(v);
const fmtDate = iso => { if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return iso || "—"; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
const toISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayISO = () => toISO(new Date());
function parseNum(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return isNaN(v) ? null : v;
  let s = String(v).trim().replace(/[€%\s]/g, "");
  if (s.includes(",") && s.includes(".")) {
    s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else s = s.replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
const numStr = v => (v == null || v === "" || isNaN(v)) ? "" : String(v).replace(".", ",");
const norm = s => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/\s+/g, " ").trim();
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);

  let s = 0; for (let i = 0; i < 8; i++) s += Number(a[i]) * 2 ** (8 - i);
  return (s % 11) % 10 === Number(a[8]);
}
function effPrice(l) { if (l.net > 0) return l.net / (l.quantity > 0 ? l.quantity : 1); if (l.unitPrice > 0) return l.unitPrice * (1 - (l.discountPct || 0) / 100); return null; }
// Κλειδί σύγκρισης: αγνοεί τόνους, κεφαλαία, τελείες και σύμβολα ("Φέτα Π.Ο.Π." = "ΦΕΤΑ ΠΟΠ")
const normKey = s => norm(s).replace(/[.'΄`’·]/g, "").replace(/[^A-Z0-9Α-Ω]+/g, " ").trim();
// Περιγραφή για σύγκριση: χωρίς μήνες/χρονιές ("Λογιστικές υπηρεσίες Νοεμβρίου 2025" = "... Φεβρουαρίου 2025")
const MONTH_W = /^(ΙΑΝΟΥΑΡΙ|ΦΕΒΡΟΥΑΡΙ|ΜΑΡΤΙ|ΑΠΡΙΛΙ|ΜΑΙ|ΙΟΥΝΙ|ΙΟΥΛΙ|ΑΥΓΟΥΣΤ|ΣΕΠΤΕΜΒΡΙ|ΟΚΤΩΒΡΙ|ΝΟΕΜΒΡΙ|ΔΕΚΕΜΒΡΙ)(ΟΣ|ΟΥ)$/;
function descKey(d) {
  const full = normKey(d);
  const k = normKey(String(d || "").replace(/\d{1,2}[\/.\-]\d{2,4}/g, " ")).split(" ").filter(w => w && !MONTH_W.test(w) && !/^(19|20)\d\d$/.test(w)).join(" ");
  return k || full;
}
function productKey(supplierId, l) { const c = normKey(l.code); return supplierId + "|" + (c ? "c:" + c : "d:" + descKey(l.description)); }
const pctChange = (a, b) => (a && b != null) ? (b - a) / a * 100 : null;

function periodRange(p) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  switch (p.preset) {
    case "month": return { from: toISO(new Date(y, m, 1)), to: toISO(new Date(y, m + 1, 0)) };

    case "quarter": return { from: toISO(new Date(y, m - 2, 1)), to: toISO(new Date(y, m + 1, 0)) };

}
const inRange = (d, r) => d >= r.from && d <= r.to;

async function compressImage(file, maxDim = 2000, quality = 0.85) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, maxDim / Math.max(w, h));
    w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return await new Promise(res => c.toBlob(res, "image/jpeg", quality));
  } finally { URL.revokeObjectURL(url); }
}
const blobToBase64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });
function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// Ίδια κατηγορία γραμμένη αλλιώς ("γαλακτοκομικα" = "Γαλακτοκομικά") → χρησιμοποιούμε την υπάρχουσα
function canonCat(label, list) { const l = (label || "").trim(); if (!l) return ""; return list.find(c => normKey(c) === normKey(l)) || l; }

/* Προϊόντα & ιστορικό τιμών (υπολογίζονται από τα τιμολόγια) */
function buildProducts(invoices, catOverrides = {}) {
  const map = new Map();
  const sorted = [...invoices].sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
  for (const inv of sorted) {
    const seen = new Set();
    for (const l of inv.lines) {
      const p = effPrice(l); if (p == null || p <= 0) continue;
      const key = productKey(inv.supplierId, l);
      if (seen.has(key)) continue; seen.add(key); // ίδιο είδος δύο φορές στο ίδιο τιμολόγιο → μία εγγραφή
      let e = map.get(key);
      if (!e) { e = { key, supplierId: inv.supplierId, code: l.code, description: l.description, unit: l.unit, history: [] }; map.set(key, e); }
      if (l.description) e.description = l.description; if (l.unit) e.unit = l.unit; if (l.code) e.code = l.code;
      if (l.category) e.lineCat = l.category;
      if (l.vatPct != null) e.vat = l.vatPct;
      e.history.push({ date: inv.date, price: p, qty: l.quantity, invoiceId: inv.id, invoiceNo: inv.number, createdAt: inv.createdAt });
    }
  }
  return [...map.values()].map(e => {
    const h = e.history, last = h[h.length - 1], prev = h.length > 1 ? h[h.length - 2] : null;
    const prices = h.map(x => x.price);
    const category = (e.key in catOverrides ? catOverrides[e.key] : e.lineCat) || "";
    return { ...e, category, last, prev, change: prev ? pctChange(prev.price, last.price) : null, min: Math.min(...prices), max: Math.max(...prices), first: h[0] };
  });
}

/* Ειδοποιήσεις τιμών: υπολογίζονται από όλο το ιστορικό, άρα δεν εξαρτώνται από τη σειρά καταχώρησης */
function buildAlerts(products, threshold) {
  const out = [];
  for (const p of products) {
    const h = p.history;
    for (let i = 1; i < h.length; i++) {
      const pct = pctChange(h[i - 1].price, h[i].price);
      if (pct == null || Math.abs(pct) < threshold || Math.abs(pct) < 0.01) continue;
      out.push({
        id: p.key + "|" + h[i].invoiceId, invoiceId: h[i].invoiceId, supplierId: p.supplierId, productKey: p.key, category: p.category,
        code: p.code, description: p.description, unit: p.unit,
        oldPrice: h[i - 1].price, newPrice: h[i].price, oldDate: h[i - 1].date, newDate: h[i].date,
        pct, qty: h[i].qty, createdAt: h[i].createdAt || 0,
      });
    }
  }
  return out;
}

function Sparkline({ points, w = 560, h = 140 }) {
  if (points.length < 2) return <div className="mut sm">Χρειάζονται τουλάχιστον δύο αγορές για γράφημα.</div>;
  const ps = points.map(p => p.price), min = Math.min(...ps), max = Math.max(...ps), pad = 18, span = max - min || 1;
  const x = i => pad + i * (w - pad * 2) / (points.length - 1);
  const y = v => h - pad - (v - min) / span * (h - pad * 2);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.price).toFixed(1)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "auto", display: "block" }}>
      <line x1={pad} x2={w - pad} y1={y(min)} y2={y(min)} stroke="#EFEEEA" />
      <line x1={pad} x2={w - pad} y1={y(max)} y2={y(max)} stroke="#e5e7eb" />
      <path d={d} fill="none" stroke="#1C2230" strokeWidth="2" strokeLinejoin="round" />
      {points.map((p, i) => <circle key={i} cx={x(i)} cy={y(p.price)} r="4" fill="#fff" stroke="#B8862B" strokeWidth="2"><title>{fmtDate(p.date)}: {fmtPrice(p.price)}</title></circle>)}
      <text x={w - pad} y={y(max) - 5} textAnchor="end" fontSize="11" fill="#5F6878">{fmtPrice(max)}</text>
      <text x={w - pad} y={y(min) + 13} textAnchor="end" fontSize="11" fill="#5F6878">{fmtPrice(min)}</text>
    </svg>
  );
}

function ReadingCard() {
  const [sec, setSec] = useState(0);
  useEffect(() => { const t = setInterval(() => setSec(s => s + 1), 1000); return () => clearInterval(t); }, []);
  return (
    <div className="card" style={{ textAlign: "center", padding: "60px 20px" }}>
      <div className="spin" /><b>Διαβάζω το τιμολόγιο… {sec}″</b>
      <div className="mut sm" style={{ marginTop: 6 }}>{sec < 15 ? "Συνήθως 5–15 δευτερόλεπτα" : "Το Gemini αργεί σήμερα, δοκιμάζω και εφεδρικό μοντέλο…"}</div>
    </div>
  );
}
function ScanPage({ data, settings, saveDraft, goInvoice, goAlerts, editInv, onEditDone }) {
  const [files, setFiles] = useState([]);       // {id, blob, mimeType, url, name}
  const [phase, setPhase] = useState(editInv ? "review" : "pick");   // pick | reading | review | done
  const [draft, setDraft] = useState(() => editInv ? invoiceToDraft(editInv, data.suppliers.find(x => x.id === editInv.supplierId)) : null);
  const [readMeta, setReadMeta] = useState(null);
  const [error, setError] = useState("");
  const [over, setOver] = useState(false);
  const [saving, setSaving] = useState(false);
  const [doneInfo, setDoneInfo] = useState(null);
  const camRef = useRef(), fileRef = useRef();

  useEffect(() => () => files.forEach(f => f.url && URL.revokeObjectURL(f.url)), []); // eslint-disable-line
  // Σε επεξεργασία: φόρτωσε τις αποθηκευμένες φωτογραφίες για προβολή δίπλα στη φόρμα
  useEffect(() => {
    if (!editInv) return;
    (async () => {
      const out = [];
      for (const id of editInv.fileIds || []) { const f = await dbGet("files", id); if (f) out.push({ id, blob: f.blob, mimeType: f.mimeType, url: f.mimeType === "application/pdf" ? null : URL.createObjectURL(f.blob), name: "PDF", stored: true }); }
      setFiles(out);
    })();
  }, [editInv && editInv.id]); // eslint-disable-line

  async function addFiles(list) {
    setError("");
    const out = [];
    for (const f of list) {
      if (f.type === "application/pdf") {
        if (f.size > 4 * 1024 * 1024) { setError("Το PDF είναι πάνω από 4 MB."); continue; }
        out.push({ id: uid(), blob: f, mimeType: "application/pdf", url: null, name: f.name });
      } else if (f.type.startsWith("image/")) {
        try { const b = await compressImage(f); out.push({ id: uid(), blob: b, mimeType: "image/jpeg", url: URL.createObjectURL(b), name: f.name }); }
        catch { setError("Δεν άνοιξε η εικόνα " + f.name + ". Δοκίμασε JPG ή PNG."); }
      }
    }
    setFiles(fs => [...fs, ...out].slice(0, 6));
  }

  async function read() {
    setPhase("reading"); setError("");
    try {
      const payload = { files: await Promise.all(files.map(async f => ({ mimeType: f.mimeType, data: await blobToBase64(f.blob) }))), ownAfm: settings.ownAfm || "", categories: settings.categories || [], businessType: settings.businessType || "" };
      const res = await fetch("/api/extract", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const ct = res.headers.get("content-type") || "";
      if (!ct.includes("application/json")) throw new Error("Η ανάγνωση δουλεύει μόνο όταν η εφαρμογή τρέχει στο Netlify (ή με netlify dev).");
      const j = await res.json();
      if (!res.ok || j.error) throw new Error((j.error || "Σφάλμα ανάγνωσης") + (j.tried && j.tried.length ? ` [${j.tried.join(", ")}]` : ""));
      setDraft(resultToDraft(j.result)); setReadMeta({ model: j.model, seconds: j.seconds, tried: j.tried || [] }); setPhase("review");
    } catch (e) { setError(e.message || String(e)); setPhase("pick"); }
  }

  function reset() { if (editInv) { onEditDone(editInv.id); return; } setReadMeta(null); files.forEach(f => f.url && URL.revokeObjectURL(f.url)); setFiles([]); setDraft(null); setPhase("pick"); setError(""); setDoneInfo(null); }

  const matched = useMemo(() => {
    if (!draft) return null;
    const afm = draft.supplier.afm.replace(/\D/g, "");
    return (afm && data.suppliers.find(s => s.afm === afm)) || (draft.supplier.name && data.suppliers.find(s => norm(s.name) === norm(draft.supplier.name))) || null;
  }, [draft, data.suppliers]);
  const duplicate = useMemo(() => {
    if (!draft || !matched || !draft.invoice.number) return null;
    return data.invoices.find(i => i.supplierId === matched.id && norm(i.number) === norm(draft.invoice.number) && (!editInv || i.id !== editInv.id)) || null;
  }, [draft, matched, data.invoices]);

  async function save() {
    setSaving(true);
    try {
      if (editInv) { await saveDraft(draft, [], editInv); onEditDone(editInv.id); return; }
      const r = await saveDraft(draft, files); setDoneInfo(r); setPhase("done");
    }
    catch (e) { setError("Αποτυχία αποθήκευσης: " + e.message); }
    setSaving(false);
  }

  if (phase === "reading") return <ReadingCard />;

  if (phase === "review") return (
    <>
      <h1>{editInv ? "Επεξεργασία τιμολογίου" : "Έλεγχος στοιχείων"}</h1>
      <p className="sub">{editInv ? "Διόρθωσε ό,τι χρειάζεται και αποθήκευσε." : "Δες ότι διαβάστηκαν σωστά και διόρθωσε ό,τι χρειάζεται πριν την αποθήκευση."}</p>
      {error && <div className="alert e mb">{error}</div>}
      <ReviewForm ownAfm={/^\d{9}$/.test(settings.ownAfm || "") ? settings.ownAfm : ""} editing={!!editInv} readMeta={readMeta} categories={settings.categories || []} draft={draft} setDraft={setDraft} previews={files} duplicate={duplicate} matchedSupplier={matched} saving={saving} onSave={save} onCancel={reset} />
    </>
  );

  if (phase === "done" && doneInfo) return (
    <div className="grid" style={{ maxWidth: 640 }}>
      <div className="alert ok">✓ Το τιμολόγιο {doneInfo.inv.number || ""} αποθηκεύτηκε ({fmtEur(doneInfo.inv.total)}).</div>
      {doneInfo.alerts.length > 0 && (
        <div className="card">
          <h2>🔔 Αλλαγές τιμών σε αυτό το τιμολόγιο</h2>
          <table><tbody>{doneInfo.alerts.map(a => (
            <tr key={a.id}><td>{a.description}<div className="mut sm">{fmtPrice(a.oldPrice)} → <b>{fmtPrice(a.newPrice)}</b></div></td><td className="r"><ChangeBadge pct={a.pct} /></td></tr>
          ))}</tbody></table>
        </div>
      )}
      <div className="row">
        <button className="btn p" onClick={reset}><Icon n="cam" /> Επόμενο τιμολόγιο</button>
        <button className="btn" onClick={() => goInvoice(doneInfo.inv.id)}>Προβολή τιμολογίου</button>
        {doneInfo.alerts.length > 0 && <button className="btn" onClick={goAlerts}>Όλες οι ειδοποιήσεις</button>}
      </div>
    </div>
  );

  return (
    <>
      <h1>Νέο τιμολόγιο</h1>
      <p className="sub">Η εφαρμογή διαβάζει προμηθευτή, είδη και τιμές. Πριν την αποθήκευση τα ελέγχεις.</p>
      {error && <div className="alert e mb">{error}</div>}
      <div className={"drop" + (over ? " over" : "")}
        onDragOver={e => { e.preventDefault(); setOver(true); }} onDragLeave={() => setOver(false)}
        onDrop={e => { e.preventDefault(); setOver(false); addFiles([...e.dataTransfer.files]); }}>
        <div className="drop-t">Φωτογράφισε ή ανέβασε το τιμολόγιο</div>
        <div className="mut sm" style={{ marginBottom: 18 }}>JPG, PNG ή PDF</div>
        <div className="row" style={{ justifyContent: "center" }}>
          <button className="btn g" onClick={() => camRef.current.click()}><Icon n="cam" /> Φωτογραφία</button>
          <button className="btn" onClick={() => fileRef.current.click()}><Icon n="file" /> Αρχείο / PDF</button>
        </div>
        <div className="mut sm" style={{ marginTop: 12 }}>ή σύρε τα αρχεία εδώ. Για πολυσέλιδο τιμολόγιο πρόσθεσε έως 6 σελίδες.</div>
        <input ref={camRef} type="file" accept="image/*" capture="environment" hidden onChange={e => { addFiles([...e.target.files]); e.target.value = ""; }} />
        <input ref={fileRef} type="file" accept="image/*,application/pdf" multiple hidden onChange={e => { addFiles([...e.target.files]); e.target.value = ""; }} />
        {files.length > 0 && (
          <div className="thumbs" style={{ justifyContent: "center" }}>
            {files.map((f, i) => (
              <div className="thumb" key={f.id}>
                {f.url ? <img src={f.url} alt="" /> : <span>PDF<br />{i + 1}</span>}
                <button onClick={() => { f.url && URL.revokeObjectURL(f.url); setFiles(fs => fs.filter(x => x.id !== f.id)); }}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="row mt">
        <button className="btn" onClick={() => { setDraft(emptyDraft()); setPhase("review"); }}>Χειροκίνητη καταχώρηση</button>
        <span className="sp" />
        <button className="btn p" disabled={!files.length} onClick={read}>Ανάγνωση τιμολογίου</button>
      </div>
    </>
  );
}

function exportCSV(invoices, supById, name) {
  const n = v => v == null ? "" : String(v).replace(".", ",");
  const rows = [["Ημερομηνία", "Αριθμός", "Είδος", "Προμηθευτής", "ΑΦΜ", "Καθαρή αξία", "ΦΠΑ", "Σύνολο", "ΜΑΡΚ"]];
  invoices.forEach(i => { const s = supById[i.supplierId] || {}; rows.push([fmtDate(i.date), i.number, i.type, s.name, s.afm, n(i.net), n(i.vat), n(i.total), i.mark]); });
  const csv = "﻿" + rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  download(name, csv, "text/csv;charset=utf-8");
}

// Κλειστές ομάδες με σύνοψη στην κεφαλίδα. Ανοίγουν όλες όταν υπάρχει αναζήτηση.
function CatGroups({ items, forceOpen, summary, children }) {
  const labels = [...new Set(items.map(x => x.category || ""))].sort((a, b) => !a ? 1 : !b ? -1 : a.localeCompare(b, "el"));

  return (
    <div className="grps">
      {labels.map(c => {
        const list = items.filter(x => (x.category || "") === c);
        return (
          <details key={c + (forceOpen ? "|o" : "|c")} className="grp" open={forceOpen || labels.length === 1}>
            <summary>
              <span className="gl" style={c ? {} : { color: "var(--muted)" }}>{catLabel(c)}</span>
              <span className="gc">{list.length}</span>
              <span className="sp" />{summary(list)}
              <span className="chev">›</span>
            </summary>
            <div className="gbody">{children(list)}</div>

  );
}

// Μονάδα σε απλά λόγια: "Κιλά" → "το κιλό"
function unitWord(u) {
  const k = normKey(u || "");
  if (!k) return "";
  if (/^(ΚΙΛ|KG|ΚΓΡ|ΚΓ$)/.test(k)) return "το κιλό";
  if (/^(ΤΕΜ|ΤΜΧ|PCS|ΤΕΜΑΧ)/.test(k)) return "το τεμάχιο";
  if (/^(ΛΙΤ|LT|LTR)/.test(k)) return "το λίτρο";
  if (/^ΚΙΒ/.test(k)) return "το κιβώτιο";
  if (/^(ΣΥΣΚ|ΠΑΚ)/.test(k)) return "τη συσκευασία";
  if (/^(ΦΙΑΛ|ΜΠΟΥΚ)/.test(k)) return "το μπουκάλι";
  return "ανά " + u;
}
// Διαφορά τιμής: κάτω από 1 € σε λεπτά ("2 λεπτά"), αλλιώς σε ευρώ
function fmtDiff(d) { const c = Math.round(Math.abs(d) * 100); return Math.abs(d) < 1 ? (c <= 1 ? "1 λεπτό" : c + " λεπτά") : fmtEur(Math.abs(d)); }

function AlertItem({ a, sup, cheaper, onOpen }) {
  const up = a.pct > 0, d = a.newPrice - a.oldPrice, money = a.qty ? Math.abs(d * a.qty) : null, uw = unitWord(a.unit);
  return (
    <div className={"al-item " + (up ? "up" : "down") + (a.read ? "" : " new")} onClick={onOpen}>
      <div className="al-top">
        <b>{a.description}</b>{!a.read && <span className="badge b-warn">Νέα</span>}
        <span className="sp" />
        {money != null && <span className="al-money">{up ? "+" : "−"}{fmtEur(money)}</span>}
      </div>
      <div className="mut sm">{sup?.name || "—"}</div>
      <div className="al-line">
        {up ? "Ακρίβυνε" : "Φθήνυνε"} από <b>{fmtPrice(a.oldPrice)}</b> σε <b>{fmtPrice(a.newPrice)}</b> {uw} ({fmtDiff(d)} {up ? "πιο ακριβό" : "πιο φθηνό"}).
        {money != null && <> Στην αγορά της {fmtDate(a.newDate)} {up ? "πλήρωσες" : "γλίτωσες"} <b>{fmtEur(money)}</b>{up ? " παραπάνω" : ""}.</>}
      </div>
      {cheaper && <div className="al-tip">Το έχεις βρει φθηνότερα: <b>{fmtPrice(cheaper.last.price)}</b> {uw} από {cheaper.supName} ({fmtDate(cheaper.last.date)}).</div>}
    </div>
  );
}

function AlertsPage({ data, products = [], supById, openProduct, markAllRead }) {
  const all = data.alerts;
  const ups = all.filter(a => a.pct > 0), downs = all.filter(a => a.pct < 0);
  const [only, setOnly] = useState(ups.length || !downs.length ? "up" : "down");
  const money = a => (a.qty ? Math.abs((a.newPrice - a.oldPrice) * a.qty) : 0);
  const list = (only === "up" ? ups : downs).slice().sort((x, y) => money(y) - money(x) || Math.abs(y.pct) - Math.abs(x.pct));
  const unread = all.filter(a => !a.read).length;
  const lost = sum(ups, money), saved = sum(downs, money), net = lost - saved;
  // Ίδιο είδος από άλλον προμηθευτή σε χαμηλότερη τιμή (τελευταία αγορά)
  const byDesc = useMemo(() => { const m = {}; for (const p of products) (m[descKey(p.description)] ||= []).push(p); return m; }, [products]);
  const cheaperFor = a => {
    if (a.pct <= 0) return null;
    const c = (byDesc[descKey(a.description)] || []).filter(p => p.supplierId !== a.supplierId && p.last && p.last.price < a.newPrice * 0.98).sort((x, y) => x.last.price - y.last.price)[0];
    return c ? { ...c, supName: supById[c.supplierId]?.name || "άλλον προμηθευτή" } : null;
  };
  const n = (k, one, many) => k === 1 ? one : `${k} ${many}`;
  return (
    <>
      <div className="row" style={{ alignItems: "flex-start" }}>
        <div><h1>Αλλαγές τιμών</h1><p className="sub">Κάθε φορά που ένας προμηθευτής αλλάζει τιμή, το βλέπεις εδώ.</p></div>
        <span className="sp" />{unread > 0 && <button className="btn" onClick={markAllRead}>Τα είδα όλα</button>}
      </div>
      {!all.length ? <div className="card empty">Καμία αλλαγή τιμής ακόμα. Θα εμφανιστεί εδώ μόλις αγοράσεις ξανά ένα είδος σε άλλη τιμή.</div> : (
        <>
          <div className="al-hero">
            <div className="al-big up"><div className="l">Έχασες από αυξήσεις</div><div className="v">{fmtEur(lost)}</div><div className="s">{n(ups.length, "1 είδος ακρίβυνε", "είδη ακρίβυναν")}</div></div>
            <div className="al-big down"><div className="l">Κέρδισες από μειώσεις</div><div className="v">{fmtEur(saved)}</div><div className="s">{n(downs.length, "1 είδος φθήνυνε", "είδη φθήνυναν")}</div></div>
          </div>
          <p className="al-sum">{net > 0.005 ? <>Συνολικά πλήρωσες <b className="up">{fmtEur(net)} περισσότερα</b> από πριν.</> : net < -0.005 ? <>Συνολικά πλήρωσες <b className="down">{fmtEur(-net)} λιγότερα</b> από πριν.</> : "Συνολικά δεν πλήρωσες ούτε παραπάνω ούτε λιγότερα."}</p>
          <div className="card grid">
            <div className="chips">
              <button className={"chip" + (only === "up" ? " on" : "")} onClick={() => setOnly("up")}>Ακρίβυναν ({ups.length})</button>
              <button className={"chip" + (only === "down" ? " on" : "")} onClick={() => setOnly("down")}>Φθήνυναν ({downs.length})</button>
            </div>
            {!list.length ? <div className="empty">{only === "up" ? "Τίποτα δεν ακρίβυνε. Καλά νέα." : "Τίποτα δεν φθήνυνε ακόμα."}</div>
              : <div className="al-list">{list.map(a => <AlertItem key={a.id} a={a} sup={supById[a.supplierId]} cheaper={cheaperFor(a)} onOpen={() => openProduct(a.productKey)} />)}</div>}
            <div className="mut sm">Τιμές χωρίς ΦΠΑ. Τα ποσά βγαίνουν από την ποσότητα που αγόρασες στη νέα τιμή.</div>
          </div>
        </>
      )}
    </>
  );
}

function Dashboard({ data, supById, products, go, openSupplier, openProduct, openInvoice, settings }) {
  const now = new Date();
  const m = periodRange({ preset: "month" }), pm = periodRange({ preset: "prev" });

  const tot = sum(thisM, i => i.total), ptot = sum(prevM, i => i.total);
  const vsPrev = ptot ? (tot - ptot) / ptot * 100 : null;
  const bySup = {}; thisM.forEach(i => bySup[i.supplierId] = (bySup[i.supplierId] || 0) + (i.total || 0));
  const top = Object.entries(bySup).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const ups = data.alerts.filter(a => a.pct > 0);
  const upsM = ups.filter(a => inRange(a.newDate, m));
  const extra = sum(upsM.filter(a => a.qty), a => (a.newPrice - a.oldPrice) * a.qty);
  // «Τι ακρίβυνε»: οι πιο πρόσφατες αυξήσεις, με τη μεγαλύτερη επίπτωση πρώτα
  const rises = [...ups].sort((a, b) => b.newDate.localeCompare(a.newDate) || ((b.newPrice - b.oldPrice) * (b.qty || 1)) - ((a.newPrice - a.oldPrice) * (a.qty || 1))).slice(0, 6);
  // Αγορές ανά μήνα (6 μήνες)
  const months = [...Array(6)].map((_, k) => {
    const d = new Date(now.getFullYear(), now.getMonth() - 5 + k, 1);
    const r = { from: toISO(d), to: toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
    return { label: d.toLocaleDateString("el-GR", { month: "short" }).replace(".", ""), long: d.toLocaleDateString("el-GR", { month: "long", year: "numeric" }), v: sum(data.invoices.filter(i => inRange(i.date, r)), i => i.total), cur: k === 5 };
  });
  const maxM = Math.max(...months.map(x => x.v), 1);
  const recent = [...data.invoices].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt).slice(0, 5);
  const monthName = now.toLocaleDateString("el-GR", { month: "long" });
  const unread = data.alerts.filter(a => !a.read).length;

  if (!data.invoices.length) return (
    <div className="card" style={{ padding: "56px 28px", maxWidth: 640 }}>
      <h1>Ξεκίνα με το πρώτο τιμολόγιο</h1>

      <button className="btn g" onClick={() => go("scan")}><Icon n="cam" /> Σάρωση τιμολογίου</button>
    </div>
  );

  return (
    <>
      <div className="phead">
        <div><h1>{settings.businessName || "Επισκόπηση"}</h1><p className="sub">Αγορές και τιμές, {now.toLocaleDateString("el-GR", { month: "long", year: "numeric" })}</p></div>
        <span className="sp" />
        <button className="btn g" onClick={() => go("scan")}><Icon n="cam" /> Νέο τιμολόγιο</button>
      </div>

      <div className="kpis">
        <div className="kpi"><div className="l">Αγορές {monthName}, με ΦΠΑ</div><div className="v">{fmtEur(tot)}</div>
          <div className="s">{vsPrev == null ? `${thisM.length} τιμολόγια` : <>{vsPrev >= 0 ? "+" : "−"}{Math.abs(vsPrev).toLocaleString("el-GR", { maximumFractionDigits: 0 })}% από τον προηγούμενο μήνα</>}</div></div>
        <div className="kpi"><div className="l">Τιμολόγια μήνα</div><div className="v">{thisM.length}</div><div className="s">από {Object.keys(bySup).length} προμηθευτές</div></div>
        <div className={"kpi" + (upsM.length ? " alert-k" : "")}><div className="l">Αυξήσεις τιμών μήνα</div><div className="v">{upsM.length}</div><div className="s">{upsM.length ? (upsM.filter(a => !a.read).length ? `${upsM.filter(a => !a.read).length} δεν τις έχεις δει` : "τις έχεις δει όλες") : "καμία αυτόν τον μήνα"}</div></div>
        <div className={"kpi" + (extra > 0 ? " alert-k" : "")}><div className="l">Επιπλέον κόστος μήνα</div><div className="v">{fmtEur(extra)}</div><div className="s">λόγω αυξήσεων</div></div>
      </div>

      <div className="split mb">
        <div className="card">
          <div className="row" style={{ marginBottom: 4 }}><h2 style={{ margin: 0 }}>Τι ακρίβυνε</h2><span className="sp" />{ups.length > 0 && <button className="btn sm" onClick={() => go("alerts")}>Όλες οι αυξήσεις</button>}</div>
          {!rises.length ? <div className="empty">Καμία αύξηση τιμής ακόμα. Θα εμφανιστούν εδώ όταν ένα είδος έρθει ακριβότερα από την προηγούμενη φορά.</div> :
            rises.map(a => (
              <div key={a.id} className="rise" onClick={() => openProduct(a.productKey)}>
                <div style={{ minWidth: 0 }}><div className="rn">{a.description}</div><div className="rs">{supById[a.supplierId]?.name}, {fmtDate(a.newDate)}</div></div>
                <div className="rp hide-m">{fmtPrice(a.oldPrice)} → <b>{fmtPrice(a.newPrice)}</b></div>
                <div className="rd">+{a.pct.toLocaleString("el-GR", { maximumFractionDigits: 1 })}%{a.qty ? <small>+{fmtEur((a.newPrice - a.oldPrice) * a.qty)}</small> : null}</div>
              </div>
            ))}
        </div>
        <div className="grid">
          <div className="card">
            <h2>Αγορές ανά μήνα</h2>
            <div className="bars" role="img" aria-label={months.map(x => `${x.long}: ${fmtEur(x.v)}`).join(", ")}>
              {months.map(x => (
                <div key={x.long} className={"bar" + (x.cur ? " cur" : "")} title={`${x.long}: ${fmtEur(x.v)}`}>
                  {x.cur && <em>{fmtEur(x.v)}</em>}
                  <i style={{ height: `${Math.max(x.v / maxM * 100, 1.5)}%` }} />
                  <span>{x.label}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <h2>Μεγαλύτεροι προμηθευτές, {monthName}</h2>
            {!top.length ? <div className="mut sm">Κανένα τιμολόγιο αυτόν τον μήνα.</div> : top.map(([id, v]) => (
              <div key={id} className="share" onClick={() => openSupplier(id)}>
                <span className="sup-name" style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{supById[id]?.name}</span>
                <span className="money">{fmtEur(v)}</span>
                <span className="bg"><i style={{ width: `${tot ? v / tot * 100 : 0}%` }} /></span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="row" style={{ marginBottom: 6 }}><h2 style={{ margin: 0 }}>Τελευταία τιμολόγια</h2><span className="sp" /><button className="btn sm" onClick={() => go("invoices")}>Όλα τα τιμολόγια</button></div>
        <div className="tbl"><table><tbody>{recent.map(i => (
          <tr key={i.id} className="click" onClick={() => openInvoice(i.id)}>
            <td><div className="sup-name">{supById[i.supplierId]?.name}</div><div className="mut sm">{fmtDate(i.date)}{i.number ? `, αρ. ${i.number}` : ""}</div></td><td className="r nw money">{fmtEur(i.total)}</td>
          </tr>
        ))}</tbody></table></div>
      </div>
    </>
  );
}

function SettingsPage({ settings, saveSettings, data, reload, toast, products, renameCategory }) {
  const [s, setS] = useState(settings);
  const impRef = useRef();
  async function doExport() {
    const meta = await dbAll("meta");
    download(`timologia_backup_${todayISO()}.json`, JSON.stringify({ app: "timologia", version: 1, exportedAt: new Date().toISOString(), suppliers: data.suppliers, invoices: data.invoices.map(i => ({ ...i, fileIds: [] })), alerts: data.alerts, meta }, null, 1), "application/json");
  }
  async function doImport(file) {
    try {
      const j = JSON.parse(await file.text());
      if (j.app !== "timologia") throw new Error("Δεν είναι αρχείο αντιγράφου αυτής της εφαρμογής.");
      for (const k of ["suppliers", "invoices", "alerts", "meta"]) for (const v of j[k] || []) await dbPut(k, v);
      await reload(); toast("Η επαναφορά ολοκληρώθηκε");
    } catch (e) { alert("Αποτυχία: " + e.message); }
  }
  async function wipe() {
    if (!confirm("Θα διαγραφούν ΟΛΑ τα δεδομένα από αυτή τη συσκευή. Συνέχεια;")) return;
    for (const st of STORES) await dbClear(st);
    await reload(); toast("Τα δεδομένα διαγράφηκαν");
  }
  return (
    <>
      <h1>Ρυθμίσεις</h1><p className="sub">Στοιχεία επιχείρησης, ειδοποιήσεις και αντίγραφα ασφαλείας.</p>
      <div className="card mb">
        <h2>Η επιχείρησή μου</h2>
        <div className="fgrid">
          <Field label="Επωνυμία" wide value={s.businessName} onChange={v => setS(x => ({ ...x, businessName: v }))} invalid={!(s.businessName || "").trim()} />
          <Field label="Είδος επιχείρησης" value={s.businessType} placeholder="π.χ. Ταβέρνα, Κομμωτήριο" onChange={v => setS(x => ({ ...x, businessType: v }))} hint="Βοηθά στη δημιουργία κατάλληλων κατηγοριών" />
          <Field label="ΑΦΜ (υποχρεωτικό)" value={s.ownAfm} inputMode="numeric" onChange={v => setS(x => ({ ...x, ownAfm: v.replace(/\D/g, "").slice(0, 9) }))} invalid={!validAfm(s.ownAfm || "")} hint={validAfm(s.ownAfm || "") ? "Μόνο τιμολόγια με αυτό το ΑΦΜ αγοραστή μετράνε στα έξοδά σου" : "Χρειάζεται έγκυρο ΑΦΜ 9 ψηφίων"} />
          <Field label="Ειδοποίηση από μεταβολή %" inputMode="decimal" value={numStr(s.threshold)} onChange={v => setS(x => ({ ...x, threshold: v }))} />
        </div>
        <div className="row mt"><span className="sp" /><button className="btn p" disabled={!validAfm(s.ownAfm || "") || !(s.businessName || "").trim()} onClick={() => { saveSettings({ ...settings, businessName: s.businessName.trim(), businessType: (s.businessType || "").trim(), ownAfm: s.ownAfm, threshold: parseNum(s.threshold) ?? 1 }); toast("Αποθηκεύτηκε"); }}>Αποθήκευση</button></div>
      </div>
      <div className="card mb">
        <h2>Κατηγορίες ειδών</h2>
        <p className="mut sm" style={{ marginTop: 0 }}>Δημιουργούνται αυτόματα από τα τιμολόγια. Μετονόμασε μια κατηγορία με όνομα που ήδη υπάρχει για να τις συγχωνεύσεις.</p>
        {!(settings.categories || []).length ? <div className="mut sm">Δεν υπάρχουν κατηγορίες ακόμα.</div> : (
          <table><tbody>{[...settings.categories].sort((a, b) => a.localeCompare(b, "el")).map(c => (
            <tr key={c}>
              <td>{c}</td><td className="r mut sm nw">{products.filter(p => p.category === c).length} είδη</td>
              <td className="r nw">
                <button className="btn sm" onClick={() => { const v = prompt("Νέο όνομα για «" + c + "»:", c); if (v && v.trim() && v.trim() !== c) renameCategory(c, v); }}>Μετονομασία</button>{" "}
                <button className="btn sm d" onClick={() => { if (confirm("Διαγραφή της κατηγορίας «" + c + "»; Τα είδη της θα μείνουν χωρίς κατηγορία.")) renameCategory(c, ""); }}>Διαγραφή</button>
              </td>
            </tr>
          ))}</tbody></table>
        )}
      </div>
      <div className="card mb">
        <h2>Αντίγραφα ασφαλείας</h2>
        <p className="mut sm" style={{ marginTop: 0 }}>Σε αυτή τη δοκιμαστική έκδοση τα δεδομένα μένουν μόνο σε αυτή τη συσκευή και αυτόν τον browser. Κράτα αντίγραφο τακτικά. (Οι φωτογραφίες δεν περιλαμβάνονται στο αντίγραφο.)</p>
        <div className="row">
          <button className="btn" onClick={doExport}>Λήψη αντιγράφου (JSON)</button>
          <button className="btn" onClick={() => impRef.current.click()}>Επαναφορά από αρχείο</button>
          <input ref={impRef} type="file" accept="application/json" hidden onChange={e => { e.target.files[0] && doImport(e.target.files[0]); e.target.value = ""; }} />
          <span className="sp" />
          <button className="btn d" onClick={wipe}>Διαγραφή όλων</button>
        </div>
      </div>
      <div className="mut sm">Αποθηκευμένα: {data.invoices.length} τιμολόγια, {data.suppliers.length} προμηθευτές, {data.alerts.length} αλλαγές τιμών</div>
    </>
  );
}

// Πρώτη χρήση: χωρίς έγκυρο ΑΦΜ η εφαρμογή δεν ανοίγει
function SetupScreen({ settings, onSave }) {
  const [s, setS] = useState({ businessName: settings.businessName || "", ownAfm: settings.ownAfm || "", businessType: settings.businessType || "" });
  const [saving, setSaving] = useState(false);
  const afmOk = validAfm(s.ownAfm), nameOk = !!s.businessName.trim();
  return (
    <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", padding: 16, background: "linear-gradient(180deg,var(--ink) 0 220px,var(--paper) 220px)" }}>
      <div style={{ width: "100%", maxWidth: 520 }}>
        <div className="brand" style={{ padding: "0 4px 18px" }}><b>Price<em>Armor</em></b><span>από την AR Akron Services</span></div>
        <form className="card" style={{ padding: 28 }} onSubmit={async e => { e.preventDefault(); if (!afmOk || !nameOk) return; setSaving(true); await onSave({ ...settings, businessName: s.businessName.trim(), ownAfm: s.ownAfm, businessType: s.businessType.trim() }); }}>
          <h1>Στοιχεία επιχείρησης</h1>
          <p className="sub">Τα χρειαζόμαστε για να ξέρουμε ποια τιμολόγια είναι δικά σου. Ένα τιμολόγιο που έχει εκδοθεί σε άλλο ΑΦΜ δεν θα μετρήσει στα έξοδά σου χωρίς την επιβεβαίωσή σου.</p>
          <div className="grid" style={{ gap: 14 }}>
            <Field label="ΑΦΜ επιχείρησης" value={s.ownAfm} inputMode="numeric" placeholder="9 ψηφία" onChange={v => setS(x => ({ ...x, ownAfm: v.replace(/\D/g, "").slice(0, 9) }))} invalid={s.ownAfm.length === 9 && !afmOk} hint={s.ownAfm.length === 9 && !afmOk ? "Αυτό το ΑΦΜ δεν είναι έγκυρο. Έλεγξε τα ψηφία." : "Όπως αναγράφεται στα τιμολόγια που λαμβάνεις"} />
            <Field label="Επωνυμία" value={s.businessName} placeholder="π.χ. Plaki Επισιτιστική ΙΚΕ" onChange={v => setS(x => ({ ...x, businessName: v }))} />
            <Field label="Είδος επιχείρησης (προαιρετικό)" value={s.businessType} placeholder="π.χ. Ταβέρνα, Κομμωτήριο" onChange={v => setS(x => ({ ...x, businessType: v }))} hint="Βοηθά στη δημιουργία κατάλληλων κατηγοριών ειδών" />
          </div>
          <button className="btn g mt" style={{ width: "100%", padding: "11px 14px" }} disabled={!afmOk || !nameOk || saving}>{saving ? "Αποθήκευση…" : "Συνέχεια"}</button>
        </form>
      </div>
    </div>
  );
}

const DEFAULT_SETTINGS = { id: "settings", businessName: "", businessType: "", ownAfm: "", threshold: 1, categories: [], productCats: {}, readAlerts: [] };
const NAV = [["home", "Αρχική", "home"], ["invoices", "Τιμολόγια", "doc"], ["suppliers", "Προμηθευτές", "truck"], ["products", "Είδη & τιμές", "box"], ["alerts", "Αλλαγές τιμών", "bell"], ["settings", "Ρυθμίσεις", "gear"]];

function App() {
  const [data, setData] = useState({ suppliers: [], invoices: [], alerts: [] });
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [ready, setReady] = useState(false);
  const [page, setPage] = useState("home");
  const [supplierId, setSupplierId] = useState(null);
  const [invoiceId, setInvoiceId] = useState(null);
  const [productKeyOpen, setProductKeyOpen] = useState(null);
  const [editId, setEditId] = useState(null);
  const [toastMsg, setToastMsg] = useState("");

  async function reload() {
    const [suppliers, invoices, alerts, st] = await Promise.all([dbAll("suppliers"), dbAll("invoices"), dbAll("alerts"), dbGet("meta", "settings")]);
    setData({ suppliers, invoices, alerts }); setSettings({ ...DEFAULT_SETTINGS, ...(st || {}) }); setReady(true);
  }
  useEffect(() => { reload().catch(e => { alert("Η αποθήκευση στη συσκευή δεν είναι διαθέσιμη: " + e.message); setReady(true); }); }, []);
  useEffect(() => { if (!toastMsg) return; const t = setTimeout(() => setToastMsg(""), 2600); return () => clearTimeout(t); }, [toastMsg]);

  const supById = useMemo(() => Object.fromEntries(data.suppliers.map(s => [s.id, s])), [data.suppliers]);
  const products = useMemo(() => buildProducts(data.invoices, settings.productCats || {}), [data.invoices, settings.productCats]);
  const prodByKey = useMemo(() => Object.fromEntries(products.map(p => [p.key, p])), [products]);
  const alerts = useMemo(() => {
    const readSet = new Set(settings.readAlerts || []);
    return buildAlerts(products, Number(settings.threshold) || 0).map(a => ({ ...a, read: readSet.has(a.id) }));
  }, [products, settings.threshold, settings.readAlerts]);
  const vdata = useMemo(() => ({ ...data, alerts }), [data, alerts]);
  const unread = alerts.filter(a => !a.read).length;

  function go(p) { setPage(p); setSupplierId(null); setEditId(null); window.scrollTo(0, 0); }
  function startEdit(id) { setInvoiceId(null); setEditId(id); setPage("scan"); window.scrollTo(0, 0); }
  function endEdit(id) { setEditId(null); setPage("invoices"); setInvoiceId(id); }
  function openSupplier(id) { setInvoiceId(null); setProductKeyOpen(null); setPage("suppliers"); setSupplierId(id); window.scrollTo(0, 0); }

  async function saveDraft(draft, files, existing) {
    const afm = draft.supplier.afm.replace(/\D/g, "");
    let sup = (afm && data.suppliers.find(s => s.afm === afm)) || (draft.supplier.name && data.suppliers.find(s => norm(s.name) === norm(draft.supplier.name))) || { id: uid(), createdAt: Date.now(), notes: "" };
    const pick = k => (draft.supplier[k] || "").trim() || sup[k] || "";
    sup = { ...sup, afm: afm || sup.afm || "", name: pick("name") || "Άγνωστος προμηθευτής", doy: pick("doy"), address: pick("address"), phone: pick("phone"), email: pick("email") };
    await dbPut("suppliers", sup);
    const fileIds = [];
    for (const f of files) { const id = uid(); await dbPut("files", { id, blob: f.blob, mimeType: f.mimeType }); fileIds.push(id); }
    const knownCats = settings.categories || [];
    const lines = draft.lines.filter(l => (l.description || "").trim() || (l.code || "").trim()).map(l => ({
      code: (l.code || "").trim(), description: (l.description || "").trim(), quantity: parseNum(l.quantity), unit: (l.unit || "").trim(),
      unitPrice: parseNum(l.unitPrice), discountPct: parseNum(l.discountPct), net: parseNum(l.net), vatPct: parseNum(l.vatPct),
      category: canonCat(l.category, knownCats),
    }));
    const newCats = [...new Set(lines.map(l => l.category).filter(c => c && !knownCats.includes(c)))];
    const net = parseNum(draft.invoice.net) ?? (lines.length ? Math.round(sum(lines, l => l.net) * 100) / 100 : null);
    const vat = parseNum(draft.invoice.vat);
    const total = parseNum(draft.invoice.total) ?? (net != null && vat != null ? net + vat : net);
    const inv = {
      id: existing ? existing.id : uid(), supplierId: sup.id, number: draft.invoice.number.trim(), date: draft.invoice.date || todayISO(), type: draft.invoice.type.trim(), mark: draft.invoice.mark.trim(),
      net, vat, total, paymentMethod: draft.invoice.paymentMethod.trim(), dueDate: draft.invoice.dueDate || "", lines, buyerName: ((draft.buyer || {}).name || "").trim(), buyerAfm: (draft.buyer || {}).afm || "", fileIds: existing ? existing.fileIds || [] : fileIds, notes: draft.notes || "", createdAt: existing ? existing.createdAt : Date.now(),
    };
    await dbPut("invoices", inv);
    if (newCats.length) await dbPut("meta", { ...settings, id: "settings", categories: [...knownCats, ...newCats] });
    await reload();
    const newAlerts = buildAlerts(buildProducts([...data.invoices.filter(i => i.id !== inv.id), inv], settings.productCats || {}), Number(settings.threshold) || 0).filter(a => a.invoiceId === inv.id);
    return { inv, alerts: newAlerts };
  }

  async function deleteInvoice(id) {
    const inv = data.invoices.find(i => i.id === id);
    if (inv) for (const f of inv.fileIds || []) await dbDel("files", f);
    await dbDel("invoices", id);
    for (const a of data.alerts.filter(a => a.invoiceId === id)) await dbDel("alerts", a.id);
    setInvoiceId(null); await reload(); setToastMsg("Το τιμολόγιο διαγράφηκε");
  }
  async function markAllRead() { await dbPut("meta", { ...settings, id: "settings", readAlerts: alerts.map(a => a.id) }); await reload(); }
  async function setCategory(key, cat) {
    const cats = settings.categories || [], c = canonCat(cat, cats);
    await dbPut("meta", { ...settings, id: "settings", productCats: { ...(settings.productCats || {}), [key]: c }, categories: c && !cats.includes(c) ? [...cats, c] : cats });
    await reload(); setToastMsg("Η κατηγορία άλλαξε");
  }
  // Στέλνει τις περιγραφές (μόνο κείμενο) στο Gemini και αποθηκεύει τις κατηγορίες που πρότεινε
  async function autoClassify(list) {
    try {
      const cats = [...(settings.categories || [])];
      const res = await fetch("/api/extract", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: "classify", items: list.map(p => p.description), categories: cats, businessType: settings.businessType || "" }) });
      const j = await res.json();
      if (!res.ok || j.error) throw new Error(j.error || "Σφάλμα");
      const pc = { ...(settings.productCats || {}) };
      for (const a of j.result.assignments || []) {
        const p = list[a.i]; if (!p || !a.category) continue;
        const c = canonCat(a.category, cats); if (!cats.includes(c)) cats.push(c);
        pc[p.key] = c;
      }
      await dbPut("meta", { ...settings, id: "settings", productCats: pc, categories: cats });
      await reload(); setToastMsg("Τα είδη κατατάχθηκαν");
    } catch (e) { alert("Η κατηγοριοποίηση απέτυχε: " + e.message); }
  }
  // Μετονομασία (ή συγχώνευση, αν το νέο όνομα υπάρχει ήδη) / διαγραφή κατηγορίας
  async function renameCategory(from, to) {
    const cats = settings.categories || [];
    to = (to || "").trim(); if (to) to = canonCat(to, cats.filter(c => c !== from));
    const newCats = [...new Set(cats.map(c => c === from ? to : c).filter(Boolean))];
    const pc = Object.fromEntries(Object.entries(settings.productCats || {}).map(([k, v]) => [k, v === from ? to : v]));
    for (const inv of data.invoices) if (inv.lines.some(l => l.category === from)) await dbPut("invoices", { ...inv, lines: inv.lines.map(l => l.category === from ? { ...l, category: to } : l) });
    await dbPut("meta", { ...settings, id: "settings", categories: newCats, productCats: pc });
    await reload(); setToastMsg(to ? "Η κατηγορία ενημερώθηκε" : "Η κατηγορία διαγράφηκε");
  }
  async function saveSettings(s) { await dbPut("meta", { ...s, id: "settings" }); await reload(); }
  async function updateSupplier(s) { await dbPut("suppliers", s); await reload(); setToastMsg("Αποθηκεύτηκε"); }

  if (!ready) return <div className="empty" style={{ paddingTop: 120 }}><div className="spin" /></div>;
  if (!validAfm(settings.ownAfm || "")) return <SetupScreen settings={settings} onSave={saveSettings} />;

  const openInv = invoiceId && data.invoices.find(i => i.id === invoiceId);
  const openProd = productKeyOpen && prodByKey[productKeyOpen];
  const supplier = supplierId && supById[supplierId];

  let content;
  const editInv = editId && data.invoices.find(i => i.id === editId);
  if (page === "scan") content = <ScanPage key={editId || "new"} editInv={editInv} onEditDone={endEdit} data={vdata} settings={settings} saveDraft={saveDraft} goInvoice={id => setInvoiceId(id)} goAlerts={() => go("alerts")} />;
  else if (page === "invoices") content = <InvoicesPage data={vdata} supById={supById} openInvoice={setInvoiceId} />;
  else if (page === "suppliers") content = supplier
    ? <SupplierDetail key={supplier.id} supplier={supplier} data={vdata} products={products} supById={supById} openInvoice={setInvoiceId} openProduct={setProductKeyOpen} onBack={() => setSupplierId(null)} onUpdate={updateSupplier} />
    : <SuppliersPage data={vdata} openSupplier={openSupplier} />;
  else if (page === "products") content = <ProductsPage products={products} supById={supById} openProduct={setProductKeyOpen} autoClassify={autoClassify} />;
  else if (page === "alerts") content = <AlertsPage data={vdata} products={products} supById={supById} openProduct={setProductKeyOpen} markAllRead={markAllRead} />;
  else if (page === "settings") content = <SettingsPage products={products} renameCategory={renameCategory} settings={settings} saveSettings={saveSettings} data={vdata} reload={reload} toast={setToastMsg} />;
  else content = <Dashboard data={vdata} supById={supById} products={products} go={go} openSupplier={openSupplier} openProduct={setProductKeyOpen} openInvoice={setInvoiceId} settings={settings} />;

  return (
    <>
      <div className="mtop">
        <div className="brand"><b>Price<em>Armor</em></b><span>AR Akron</span></div><span className="sp" />
        <button className="icbtn" onClick={() => go("alerts")} aria-label="Αλλαγές τιμών"><Icon n="bell" />{unread > 0 && <span className="dot" />}</button>
        <button className="icbtn" onClick={() => go("settings")} aria-label="Ρυθμίσεις"><Icon n="gear" /></button>
      </div>
      <div className="app">
        <aside className="side">
          <div className="brand"><b>Price<em>Armor</em></b><span>από την AR Akron Services</span></div>
          <button className="nav scanbtn" onClick={() => go("scan")}><Icon n="cam" /> Νέο τιμολόγιο</button>
          {NAV.map(([k, l, ic]) => (
            <button key={k} className={"nav" + (page === k ? " on" : "")} onClick={() => go(k)}><Icon n={ic} /> {l}{k === "alerts" && unread > 0 && <span className="cnt">{unread}</span>}</button>
          ))}
          <div className="side-foot">{settings.businessName ? <><b>{settings.businessName}</b>{settings.businessType || "Η επιχείρησή μου"}</> : <a href="#" style={{ color: "#C8CDD7" }} onClick={e => { e.preventDefault(); go("settings"); }}>Συμπλήρωσε τα στοιχεία της επιχείρησης</a>}</div>
        </aside>
        <main className="main">{content}</main>
      </div>
      <nav className="bnav">
        {[["home", "Αρχική", "home"], ["invoices", "Τιμολόγια", "doc"], ["scan", "Σάρωση", "cam"], ["suppliers", "Προμηθ.", "truck"], ["products", "Είδη", "box"]].map(([k, l, ic]) => (
          <button key={k} className={(page === k ? "on" : "") + (k === "scan" ? " big" : "")} onClick={() => go(k)}>
            {k === "scan" ? <span className="c"><Icon n={ic} /></span> : <Icon n={ic} />}{l}
          </button>
        ))}
      </nav>
      {openInv && <InvoiceModal inv={openInv} supplier={supById[openInv.supplierId]} onClose={() => setInvoiceId(null)} onDelete={deleteInvoice} openSupplier={openSupplier} onEdit={startEdit} />}
      {openProd && <ProductModal product={openProd} supplier={supById[openProd.supplierId]} onClose={() => setProductKeyOpen(null)} openInvoice={id => { setProductKeyOpen(null); setInvoiceId(id); }} setCategory={setCategory} categories={settings.categories || []} />}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
