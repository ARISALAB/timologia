<style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================
   Βάση δεδομένων (IndexedDB, στη συσκευή)
   ========================================================= */
const DB_NAME = "timologia", DB_VER = 1;
const STORES = ["suppliers", "invoices", "files", "alerts", "meta"];
let _db = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => { const db = r.result; STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: "id" }); }); };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const s = t.objectStore(store);
    const req = fn(s);
    t.oncomplete = () => res(req && "result" in req ? req.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = s => tx(s, "readonly", st => st.getAll());
const dbGet = (s, id) => tx(s, "readonly", st => st.get(id));
const dbPut = (s, v) => tx(s, "readwrite", st => st.put(v));
const dbDel = (s, id) => tx(s, "readwrite", st => st.delete(id));
const dbClear = s => tx(s, "readwrite", st => st.clear());

/* =========================================================
   Βοηθητικά
   ========================================================= */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const EUR = new Intl.NumberFormat("el-GR", { style: "currency", currency: "EUR" });
const N4 = new Intl.NumberFormat("el-GR", { minimumFractionDigits: 2, maximumFractionDigits: 4 });
const N2 = new Intl.NumberFormat("el-GR", { maximumFractionDigits: 3 });
const fmtEur = v => (v == null || isNaN(v)) ? "—" : EUR.format(v);
const fmtPrice = v => (v == null || isNaN(v)) ? "—" : N4.format(v) + " €";
const fmtQty = v => (v == null || isNaN(v)) ? "" : N2.format(v);
const fmtDate = iso => { if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return iso || "—"; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
const toISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayISO = () => toISO(new Date());
function parseNum(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return isNaN(v) ? null : v;
  let s = String(v).trim().replace(/[€%\s]/g, "");
  if (s.includes(",") && s.includes(".")) {
    s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else s = s.replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
const numStr = v => (v == null || v === "" || isNaN(v)) ? "" : String(v).replace(".", ",");
const norm = s => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/\s+/g, " ").trim();
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
function validAfm(a) {
  if (!/^\d{9}$/.test(a) || a === "000000000") return false;
  let s = 0; for (let i = 0; i < 8; i++) s += Number(a[i]) * 2 ** (8 - i);
  return (s % 11) % 10 === Number(a[8]);
}
function effPrice(l) { if (l.unitPrice == null) return null; return l.unitPrice * (1 - (l.discountPct || 0) / 100); }
// Κλειδί σύγκρισης: αγνοεί τόνους, κεφαλαία, τελείες και σύμβολα ("Φέτα Π.Ο.Π." = "ΦΕΤΑ ΠΟΠ")
const normKey = s => norm(s).replace(/[.'΄`’·]/g, "").replace(/[^A-Z0-9Α-Ω]+/g, " ").trim();
function productKey(supplierId, l) { const c = normKey(l.code); return supplierId + "|" + (c ? "c:" + c : "d:" + normKey(l.description)); }
const pctChange = (a, b) => (a && b != null) ? (b - a) / a * 100 : null;

function periodRange(p) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  switch (p.preset) {
    case "month": return { from: toISO(new Date(y, m, 1)), to: toISO(new Date(y, m + 1, 0)) };
    case "prev": return { from: toISO(new Date(y, m - 1, 1)), to: toISO(new Date(y, m, 0)) };
    case "quarter": return { from: toISO(new Date(y, m - 2, 1)), to: toISO(new Date(y, m + 1, 0)) };
    case "year": return { from: `${y}-01-01`, to: `${y}-12-31` };
    case "custom": return { from: p.from || "0000-01-01", to: p.to || "9999-12-31" };
    default: return { from: "0000-01-01", to: "9999-12-31" };
  }
}
const inRange = (d, r) => d >= r.from && d <= r.to;

async function compressImage(file, maxDim = 2000, quality = 0.85) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, maxDim / Math.max(w, h));
    w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return await new Promise(res => c.toBlob(res, "image/jpeg", quality));
  } finally { URL.revokeObjectURL(url); }
}
const blobToBase64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });
function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* Προϊόντα & ιστορικό τιμών (υπολογίζονται από τα τιμολόγια) */
function buildProducts(invoices) {
  const map = new Map();
  const sorted = [...invoices].sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
  for (const inv of sorted) {
    const seen = new Set();
    for (const l of inv.lines) {
      const p = effPrice(l); if (p == null || p <= 0) continue;
      const key = productKey(inv.supplierId, l);
      if (seen.has(key)) continue; seen.add(key); // ίδιο είδος δύο φορές στο ίδιο τιμολόγιο → μία εγγραφή
      let e = map.get(key);
      if (!e) { e = { key, supplierId: inv.supplierId, code: l.code, description: l.description, unit: l.unit, history: [] }; map.set(key, e); }
      if (l.description) e.description = l.description; if (l.unit) e.unit = l.unit; if (l.code) e.code = l.code;
      e.history.push({ date: inv.date, price: p, qty: l.quantity, invoiceId: inv.id, invoiceNo: inv.number, createdAt: inv.createdAt });
    }
  }
  return [...map.values()].map(e => {
    const h = e.history, last = h[h.length - 1], prev = h.length > 1 ? h[h.length - 2] : null;
    const prices = h.map(x => x.price);
    return { ...e, last, prev, change: prev ? pctChange(prev.price, last.price) : null, min: Math.min(...prices), max: Math.max(...prices), first: h[0] };
  });
}

/* Ειδοποιήσεις τιμών: υπολογίζονται από όλο το ιστορικό, άρα δεν εξαρτώνται από τη σειρά καταχώρησης */
function buildAlerts(products, threshold) {
  const out = [];
  for (const p of products) {
    const h = p.history;
    for (let i = 1; i < h.length; i++) {
      const pct = pctChange(h[i - 1].price, h[i].price);
      if (pct == null || Math.abs(pct) < threshold || Math.abs(pct) < 0.01) continue;
      out.push({
        id: p.key + "|" + h[i].invoiceId, invoiceId: h[i].invoiceId, supplierId: p.supplierId, productKey: p.key,
        code: p.code, description: p.description, unit: p.unit,
        oldPrice: h[i - 1].price, newPrice: h[i].price, oldDate: h[i - 1].date, newDate: h[i].date,
        pct, qty: h[i].qty, createdAt: h[i].createdAt || 0,
      });
    }
  }
  return out;
}

/* =========================================================
   Εικονίδια
   ========================================================= */
const P = {
  home: "M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z",
  doc: "M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm7 0v5h5M9 13h6M9 17h6",
  cam: "M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zm8 3.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z",
  truck: "M3 6h11v10H3zm11 4h4l3 3v3h-7M7 19.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm10 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z",
  box: "M12 3 3 7.5v9L12 21l9-4.5v-9zm0 0v18M3 7.5l9 4.5 9-4.5",
  bell: "M6 16V11a6 6 0 1 1 12 0v5l2 2H4zm4 4h4",
  gear: "M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm8.5 3a8.5 8.5 0 0 0-.1-1.3l2-1.6-2-3.4-2.4 1a8 8 0 0 0-2.2-1.3L15.5 2h-4l-.4 2.4A8 8 0 0 0 9 5.7l-2.4-1-2 3.4 2 1.6a8.5 8.5 0 0 0 0 2.6l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 2.2 1.3l.4 2.4h4l.4-2.4a8 8 0 0 0 2.2-1.3l2.4 1 2-3.4-2-1.6c.1-.4.1-.9.1-1.3z",
  up: "M12 19V5m-6 6 6-6 6 6", file: "M12 3v12m-5-5 5 5 5-5M5 21h14", plus: "M12 5v14M5 12h14", back: "M15 18l-6-6 6-6",
};
function Icon({ n }) { return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={P[n]} /></svg>; }

/* =========================================================
   Κοινά μικρά components
   ========================================================= */
function ChangeBadge({ pct }) {
  if (pct == null || isNaN(pct)) return <span className="badge b-eq">—</span>;
  if (Math.abs(pct) < 0.05) return <span className="badge b-eq">=</span>;
  const up = pct > 0;
  return <span className={"badge " + (up ? "b-up" : "b-down")}>{up ? "▲" : "▼"} {Math.abs(pct).toLocaleString("el-GR", { maximumFractionDigits: 1 })}%</span>;
}

function Modal({ children, onClose, small }) {
  useEffect(() => { const h = e => e.key === "Escape" && onClose(); window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  return <div className="modal-bg" onMouseDown={e => e.target === e.currentTarget && onClose()}><div className={"modal" + (small ? " sm" : "")}>{children}</div></div>;
}

function Field({ label, value, onChange, type = "text", placeholder, wide, inputMode, invalid, hint }) {

}

function Sparkline({ points, w = 560, h = 140 }) {
  if (points.length < 2) return <div className="mut sm">Χρειάζονται τουλάχιστον δύο αγορές για γράφημα.</div>;
  const ps = points.map(p => p.price), min = Math.min(...ps), max = Math.max(...ps), pad = 18, span = max - min || 1;
  const x = i => pad + i * (w - pad * 2) / (points.length - 1);
  const y = v => h - pad - (v - min) / span * (h - pad * 2);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.price).toFixed(1)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "auto", display: "block" }}>
      <line x1={pad} x2={w - pad} y1={y(min)} y2={y(min)} stroke="#e5e7eb" />
      <line x1={pad} x2={w - pad} y1={y(max)} y2={y(max)} stroke="#e5e7eb" />
      <path d={d} fill="none" stroke="#2563eb" strokeWidth="2.2" strokeLinejoin="round" />
      {points.map((p, i) => <circle key={i} cx={x(i)} cy={y(p.price)} r="3.5" fill="#fff" stroke="#2563eb" strokeWidth="2"><title>{fmtDate(p.date)}: {fmtPrice(p.price)}</title></circle>)}
      <text x={w - pad} y={y(max) - 5} textAnchor="end" fontSize="11" fill="#64748b">{fmtPrice(max)}</text>
      <text x={w - pad} y={y(min) + 13} textAnchor="end" fontSize="11" fill="#64748b">{fmtPrice(min)}</text>
    </svg>
  );
}

function emptyLine() { return { id: uid(), code: "", description: "", quantity: "", unit: "", unitPrice: "", discountPct: "", net: "", vatPct: "" }; }
function emptyDraft() {
  return { supplier: { afm: "", name: "", doy: "", address: "", phone: "", email: "" }, invoice: { number: "", date: todayISO(), type: "", mark: "", net: "", vat: "", total: "", paymentMethod: "", dueDate: "" }, lines: [emptyLine()], notes: "" };
}
function resultToDraft(r) {
  const s = r.supplier || {}, i = r.invoice || {};
  const lines = (r.lines || []).map(l => ({ id: uid(), code: l.code || "", description: l.description || "", quantity: numStr(l.quantity), unit: l.unit || "", unitPrice: numStr(l.unit_price), discountPct: numStr(l.discount_pct), net: numStr(l.net_amount), vatPct: numStr(l.vat_pct) }));
  return {
    supplier: { afm: (s.afm || "").replace(/\D/g, ""), name: s.name || "", doy: s.doy || "", address: s.address || "", phone: s.phone || "", email: s.email || "" },
    invoice: { number: i.number || "", date: /^\d{4}-\d{2}-\d{2}$/.test(i.date || "") ? i.date : todayISO(), type: i.type || "", mark: i.mark || "", net: numStr(i.net_total), vat: numStr(i.vat_total), total: numStr(i.total), paymentMethod: i.payment_method || "", dueDate: /^\d{4}-\d{2}-\d{2}$/.test(i.due_date || "") ? i.due_date : "" },
    lines: lines.length ? lines : [emptyLine()], notes: r.notes || "",
  };
}

function ReviewForm({ draft, setDraft, previews, duplicate, matchedSupplier, saving, onSave, onCancel }) {
  const setS = (k, v) => setDraft(d => ({ ...d, supplier: { ...d.supplier, [k]: v } }));
  const setI = (k, v) => setDraft(d => ({ ...d, invoice: { ...d.invoice, [k]: v } }));
  const afm = draft.supplier.afm.replace(/\D/g, "");
  const afmBad = afm.length > 0 && !validAfm(afm);
  const linesNet = sum(draft.lines, l => parseNum(l.net));
  const invNet = parseNum(draft.invoice.net);
  const mismatch = invNet != null && linesNet > 0 && Math.abs(linesNet - invNet) > 0.05;
  const totalCheck = (() => { const n = parseNum(draft.invoice.net), v = parseNum(draft.invoice.vat), t = parseNum(draft.invoice.total); return n != null && v != null && t != null && Math.abs(n + v - t) > 0.05; })();
  return (
    <div className={previews.length ? "review" : ""}>
      {previews.length > 0 && <div className="preview">{previews.map((p, i) => p.url ? <img key={i} src={p.url} alt="" /> : <div key={i} className="card sm mut">PDF: {p.name}</div>)}</div>}
      <div className="grid">
        {duplicate && <div className="alert e">⚠️ Υπάρχει ήδη τιμολόγιο {duplicate.number} από αυτόν τον προμηθευτή ({fmtDate(duplicate.date)}). Μήπως είναι διπλή καταχώρηση;</div>}
        {draft.notes && <div className="alert i">📝 {draft.notes}</div>}
        {(mismatch || totalCheck) && <div className="alert w">Έλεγξε τα ποσά: {mismatch && <>οι γραμμές αθροίζουν {fmtEur(linesNet)} ενώ η καθαρή αξία είναι {fmtEur(invNet)}. </>}{totalCheck && <>Καθαρή + ΦΠΑ δεν ισούται με το σύνολο.</>}</div>}

        <div className="card">
          <div className="row mb"><h2 style={{ margin: 0 }}>Προμηθευτής</h2>{matchedSupplier ? <span className="badge b-down">Υπάρχων: {matchedSupplier.name}</span> : <span className="badge b-acc">Νέος προμηθευτής</span>}</div>
          <div className="fgrid">
            <Field label="Επωνυμία" wide value={draft.supplier.name} onChange={v => setS("name", v)} />
            <Field label="ΑΦΜ" value={draft.supplier.afm} inputMode="numeric" onChange={v => setS("afm", v)} invalid={afmBad} hint={afmBad ? "Μη έγκυρο ΑΦΜ" : ""} />
            <Field label="ΔΟΥ" value={draft.supplier.doy} onChange={v => setS("doy", v)} />
            <Field label="Διεύθυνση" wide value={draft.supplier.address} onChange={v => setS("address", v)} />
            <Field label="Τηλέφωνο" value={draft.supplier.phone} onChange={v => setS("phone", v)} />
            <Field label="Email" value={draft.supplier.email} onChange={v => setS("email", v)} />
          </div>
        </div>

        <div className="card">
          <h2>Παραστατικό</h2>
          <div className="fgrid">
            <Field label="Αριθμός" value={draft.invoice.number} onChange={v => setI("number", v)} />
            <Field label="Ημερομηνία" type="date" value={draft.invoice.date} onChange={v => setI("date", v)} />
            <Field label="Είδος" value={draft.invoice.type} onChange={v => setI("type", v)} />
            <Field label="ΜΑΡΚ" value={draft.invoice.mark} onChange={v => setI("mark", v)} />
            <Field label="Καθαρή αξία €" inputMode="decimal" value={draft.invoice.net} onChange={v => setI("net", v)} />
            <Field label="ΦΠΑ €" inputMode="decimal" value={draft.invoice.vat} onChange={v => setI("vat", v)} />
            <Field label="Σύνολο €" inputMode="decimal" value={draft.invoice.total} onChange={v => setI("total", v)} />
            <Field label="Τρόπος πληρωμής" value={draft.invoice.paymentMethod} onChange={v => setI("paymentMethod", v)} />
          </div>
        </div>

        <div className="card">
          <div className="row mb"><h2 style={{ margin: 0 }}>Είδη ({draft.lines.length})</h2><span className="sp" /><span className="mut sm">Άθροισμα γραμμών: <b>{fmtEur(linesNet)}</b></span></div>
          <LinesEditor lines={draft.lines} onChange={lines => setDraft(d => ({ ...d, lines }))} />
        </div>

        <div className="row">
          <button className="btn" onClick={onCancel}>Ακύρωση</button>
          <span className="sp" />
          <button className="btn p" disabled={saving || !draft.supplier.name.trim()} onClick={onSave}>{saving ? "Αποθήκευση…" : "Αποθήκευση τιμολογίου"}</button>
        </div>
      </div>
    </div>
  );
}

function ReadingCard() {
  const [sec, setSec] = useState(0);
  useEffect(() => { const t = setInterval(() => setSec(s => s + 1), 1000); return () => clearInterval(t); }, []);
  return (
    <div className="card" style={{ textAlign: "center", padding: "60px 20px" }}>
      <div className="spin" /><b>Διαβάζω το τιμολόγιο… {sec}″</b>
      <div className="mut sm" style={{ marginTop: 6 }}>{sec < 15 ? "Συνήθως 5–15 δευτερόλεπτα" : "Το Gemini αργεί σήμερα, δοκιμάζω και εφεδρικό μοντέλο…"}</div>
    </div>
  );
}
function ScanPage({ data, settings, saveDraft, goInvoice, goAlerts }) {
  const [files, setFiles] = useState([]);       // {id, blob, mimeType, url, name}
  const [phase, setPhase] = useState("pick");   // pick | reading | review | done
  const [draft, setDraft] = useState(null);
  const [error, setError] = useState("");
  const [over, setOver] = useState(false);
  const [saving, setSaving] = useState(false);
  const [doneInfo, setDoneInfo] = useState(null);
  const camRef = useRef(), fileRef = useRef();

  useEffect(() => () => files.forEach(f => f.url && URL.revokeObjectURL(f.url)), []); // eslint-disable-line

  async function addFiles(list) {
    setError("");
    const out = [];
    for (const f of list) {
      if (f.type === "application/pdf") {
        if (f.size > 4 * 1024 * 1024) { setError("Το PDF είναι πάνω από 4 MB."); continue; }
        out.push({ id: uid(), blob: f, mimeType: "application/pdf", url: null, name: f.name });
      } else if (f.type.startsWith("image/")) {
        try { const b = await compressImage(f); out.push({ id: uid(), blob: b, mimeType: "image/jpeg", url: URL.createObjectURL(b), name: f.name }); }
        catch { setError("Δεν άνοιξε η εικόνα " + f.name + ". Δοκίμασε JPG ή PNG."); }
      }
    }
    setFiles(fs => [...fs, ...out].slice(0, 6));
  }

  async function read() {
    setPhase("reading"); setError("");
    try {
      const payload = { files: await Promise.all(files.map(async f => ({ mimeType: f.mimeType, data: await blobToBase64(f.blob) }))), ownAfm: settings.ownAfm || "" };
      const res = await fetch("/api/extract", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const ct = res.headers.get("content-type") || "";
      if (!ct.includes("application/json")) throw new Error("Η ανάγνωση δουλεύει μόνο όταν η εφαρμογή τρέχει στο Netlify (ή με netlify dev).");
      const j = await res.json();
      if (!res.ok || j.error) throw new Error((j.error || "Σφάλμα ανάγνωσης") + (j.tried && j.tried.length ? ` [${j.tried.join(" · ")}]` : ""));
      setDraft(resultToDraft(j.result)); setPhase("review");
    } catch (e) { setError(e.message || String(e)); setPhase("pick"); }
  }

  function reset() { files.forEach(f => f.url && URL.revokeObjectURL(f.url)); setFiles([]); setDraft(null); setPhase("pick"); setError(""); setDoneInfo(null); }

  const matched = useMemo(() => {
    if (!draft) return null;
    const afm = draft.supplier.afm.replace(/\D/g, "");
    return (afm && data.suppliers.find(s => s.afm === afm)) || (draft.supplier.name && data.suppliers.find(s => norm(s.name) === norm(draft.supplier.name))) || null;
  }, [draft, data.suppliers]);
  const duplicate = useMemo(() => {
    if (!draft || !matched || !draft.invoice.number) return null;
    return data.invoices.find(i => i.supplierId === matched.id && norm(i.number) === norm(draft.invoice.number)) || null;
  }, [draft, matched, data.invoices]);

  async function save() {
    setSaving(true);
    try { const r = await saveDraft(draft, files); setDoneInfo(r); setPhase("done"); }
    catch (e) { setError("Αποτυχία αποθήκευσης: " + e.message); }
    setSaving(false);
  }

  if (phase === "reading") return <ReadingCard />;

  if (phase === "review") return (
    <>
      <h1>Έλεγχος στοιχείων</h1>
      <p className="sub">Δες ότι διαβάστηκαν σωστά και διόρθωσε ό,τι χρειάζεται πριν την αποθήκευση.</p>
      {error && <div className="alert e mb">{error}</div>}
      <ReviewForm draft={draft} setDraft={setDraft} previews={files} duplicate={duplicate} matchedSupplier={matched} saving={saving} onSave={save} onCancel={reset} />
    </>
  );

  if (phase === "done" && doneInfo) return (
    <div className="grid" style={{ maxWidth: 640 }}>
      <div className="alert ok">✓ Το τιμολόγιο {doneInfo.inv.number || ""} αποθηκεύτηκε ({fmtEur(doneInfo.inv.total)}).</div>
      {doneInfo.alerts.length > 0 && (
        <div className="card">
          <h2>🔔 Αλλαγές τιμών σε αυτό το τιμολόγιο</h2>
          <table><tbody>{doneInfo.alerts.map(a => (
            <tr key={a.id}><td>{a.description}<div className="mut sm">{fmtPrice(a.oldPrice)} → <b>{fmtPrice(a.newPrice)}</b></div></td><td className="r"><ChangeBadge pct={a.pct} /></td></tr>
          ))}</tbody></table>
        </div>
      )}
      <div className="row">
        <button className="btn p" onClick={reset}><Icon n="cam" /> Επόμενο τιμολόγιο</button>
        <button className="btn" onClick={() => goInvoice(doneInfo.inv.id)}>Προβολή τιμολογίου</button>
        {doneInfo.alerts.length > 0 && <button className="btn" onClick={goAlerts}>Όλες οι ειδοποιήσεις</button>}
      </div>
    </div>
  );

  return (
    <>
      <h1>Νέο τιμολόγιο</h1>
      <p className="sub">Φωτογράφισε το τιμολόγιο ή ανέβασε PDF. Για πολυσέλιδο, πρόσθεσε όλες τις σελίδες.</p>
      {error && <div className="alert e mb">{error}</div>}
      <div className={"drop" + (over ? " over" : "")}
        onDragOver={e => { e.preventDefault(); setOver(true); }} onDragLeave={() => setOver(false)}
        onDrop={e => { e.preventDefault(); setOver(false); addFiles([...e.dataTransfer.files]); }}>
        <div className="row" style={{ justifyContent: "center" }}>
          <button className="btn p" onClick={() => camRef.current.click()}><Icon n="cam" /> Φωτογραφία</button>
          <button className="btn" onClick={() => fileRef.current.click()}><Icon n="file" /> Αρχείο / PDF</button>
        </div>
        <div className="mut sm" style={{ marginTop: 10 }}>ή σύρε αρχεία εδώ · έως 6 σελίδες</div>
        <input ref={camRef} type="file" accept="image/*" capture="environment" hidden onChange={e => { addFiles([...e.target.files]); e.target.value = ""; }} />
        <input ref={fileRef} type="file" accept="image/*,application/pdf" multiple hidden onChange={e => { addFiles([...e.target.files]); e.target.value = ""; }} />
        {files.length > 0 && (
          <div className="thumbs" style={{ justifyContent: "center" }}>
            {files.map((f, i) => (
              <div className="thumb" key={f.id}>
                {f.url ? <img src={f.url} alt="" /> : <span>PDF<br />{i + 1}</span>}
                <button onClick={() => { f.url && URL.revokeObjectURL(f.url); setFiles(fs => fs.filter(x => x.id !== f.id)); }}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="row mt">
        <button className="btn" onClick={() => { setDraft(emptyDraft()); setPhase("review"); }}>Χειροκίνητη καταχώρηση</button>
        <span className="sp" />
        <button className="btn p" disabled={!files.length} onClick={read}>Ανάγνωση τιμολογίου →</button>
      </div>
    </>
  );
}

        <tr className="totals"><td colSpan={showSupplier ? 3 : 2}>Σύνολο ({invoices.length})</td><td className="r nw hide-m">{fmtEur(sum(invoices, i => i.net))}</td><td className="r nw hide-m">{fmtEur(sum(invoices, i => i.vat))}</td><td className="r nw">{fmtEur(sum(invoices, i => i.total))}</td></tr>
      </tbody>
    </table></div>
  );
}

function exportCSV(invoices, supById, name) {
  const n = v => v == null ? "" : String(v).replace(".", ",");
  const rows = [["Ημερομηνία", "Αριθμός", "Είδος", "Προμηθευτής", "ΑΦΜ", "Καθαρή αξία", "ΦΠΑ", "Σύνολο", "ΜΑΡΚ"]];
  invoices.forEach(i => { const s = supById[i.supplierId] || {}; rows.push([fmtDate(i.date), i.number, i.type, s.name, s.afm, n(i.net), n(i.vat), n(i.total), i.mark]); });
  const csv = "﻿" + rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  download(name, csv, "text/csv;charset=utf-8");
}

function Dashboard({ data, supById, products, go, openSupplier, openProduct }) {
  const m = periodRange({ preset: "month" }), pm = periodRange({ preset: "prev" });
  const thisM = data.invoices.filter(i => inRange(i.date, m)), prevM = data.invoices.filter(i => inRange(i.date, pm));
  const tot = sum(thisM, i => i.total), ptot = sum(prevM, i => i.total);
  const bySup = {}; thisM.forEach(i => bySup[i.supplierId] = (bySup[i.supplierId] || 0) + i.total);

    <>
      <h1>Επισκόπηση</h1><p className="sub">Οι αγορές σου με μια ματιά.</p>

        <div className="card stat"><div className="l">Αγορές {monthName}</div><div className="v">{fmtEur(tot)}</div><div className="s">{thisM.length} τιμολόγια</div></div>
        <div className="card stat"><div className="l">Προηγούμενος μήνας</div><div className="v">{fmtEur(ptot)}</div><div className="s">{prevM.length} τιμολόγια</div></div>

            <tr key={a.id} className="click" onClick={() => openProduct(a.productKey)}><td>{a.description}<div className="mut sm">{supById[a.supplierId]?.name}</div></td><td className="r nw sm">{fmtPrice(a.newPrice)}</td><td className="r"><ChangeBadge pct={a.pct} /></td></tr>

function SettingsPage({ settings, saveSettings, data, reload, toast }) {
  const [s, setS] = useState(settings);
  const impRef = useRef();
  async function doExport() {
    const meta = await dbAll("meta");
    download(`timologia_backup_${todayISO()}.json`, JSON.stringify({ app: "timologia", version: 1, exportedAt: new Date().toISOString(), suppliers: data.suppliers, invoices: data.invoices.map(i => ({ ...i, fileIds: [] })), alerts: data.alerts, meta }, null, 1), "application/json");
  }
  async function doImport(file) {
    try {
      const j = JSON.parse(await file.text());
      if (j.app !== "timologia") throw new Error("Δεν είναι αρχείο αντιγράφου αυτής της εφαρμογής.");
      for (const k of ["suppliers", "invoices", "alerts", "meta"]) for (const v of j[k] || []) await dbPut(k, v);
      await reload(); toast("Η επαναφορά ολοκληρώθηκε");
    } catch (e) { alert("Αποτυχία: " + e.message); }
  }
  async function wipe() {
    if (!confirm("Θα διαγραφούν ΟΛΑ τα δεδομένα από αυτή τη συσκευή. Συνέχεια;")) return;
    for (const st of STORES) await dbClear(st);
    await reload(); toast("Τα δεδομένα διαγράφηκαν");
  }
  return (
    <>
      <h1>Ρυθμίσεις</h1><p className="sub">Στοιχεία επιχείρησης, ειδοποιήσεις και αντίγραφα ασφαλείας.</p>
      <div className="card mb">
        <h2>Η επιχείρησή μου</h2>
        <div className="fgrid">
          <Field label="Επωνυμία" wide value={s.businessName} onChange={v => setS(x => ({ ...x, businessName: v }))} />
          <Field label="ΑΦΜ" value={s.ownAfm} inputMode="numeric" onChange={v => setS(x => ({ ...x, ownAfm: v.replace(/\D/g, "") }))} invalid={s.ownAfm && !validAfm(s.ownAfm)} hint="Βοηθά την ανάγνωση να μη μπερδεύει εσένα με τον προμηθευτή" />
          <Field label="Ειδοποίηση από μεταβολή %" inputMode="decimal" value={numStr(s.threshold)} onChange={v => setS(x => ({ ...x, threshold: v }))} />
        </div>
        <div className="row mt"><span className="sp" /><button className="btn p" onClick={() => { saveSettings({ ...s, threshold: parseNum(s.threshold) ?? 1 }); toast("Αποθηκεύτηκε"); }}>Αποθήκευση</button></div>
      </div>
      <div className="card mb">
        <h2>Αντίγραφα ασφαλείας</h2>
        <p className="mut sm" style={{ marginTop: 0 }}>Σε αυτή τη δοκιμαστική έκδοση τα δεδομένα μένουν μόνο σε αυτή τη συσκευή και αυτόν τον browser. Κράτα αντίγραφο τακτικά. (Οι φωτογραφίες δεν περιλαμβάνονται στο αντίγραφο.)</p>
        <div className="row">
          <button className="btn" onClick={doExport}>Λήψη αντιγράφου (JSON)</button>
          <button className="btn" onClick={() => impRef.current.click()}>Επαναφορά από αρχείο</button>
          <input ref={impRef} type="file" accept="application/json" hidden onChange={e => { e.target.files[0] && doImport(e.target.files[0]); e.target.value = ""; }} />
          <span className="sp" />
          <button className="btn d" onClick={wipe}>Διαγραφή όλων</button>
        </div>
      </div>
      <div className="mut sm">{data.invoices.length} τιμολόγια · {data.suppliers.length} προμηθευτές · {data.alerts.length} ειδοποιήσεις</div>
    </>
  );
}

/* =========================================================
   Εφαρμογή
   ========================================================= */
const DEFAULT_SETTINGS = { id: "settings", businessName: "", ownAfm: "", threshold: 1 };
const NAV = [["home", "Αρχική", "home"], ["invoices", "Τιμολόγια", "doc"], ["suppliers", "Προμηθευτές", "truck"], ["products", "Είδη & τιμές", "box"], ["alerts", "Ειδοποιήσεις", "bell"], ["settings", "Ρυθμίσεις", "gear"]];

function App() {
  const [data, setData] = useState({ suppliers: [], invoices: [], alerts: [] });
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [ready, setReady] = useState(false);
  const [page, setPage] = useState("home");
  const [supplierId, setSupplierId] = useState(null);
  const [invoiceId, setInvoiceId] = useState(null);
  const [productKeyOpen, setProductKeyOpen] = useState(null);
  const [toastMsg, setToastMsg] = useState("");

  async function reload() {
    const [suppliers, invoices, alerts, st] = await Promise.all([dbAll("suppliers"), dbAll("invoices"), dbAll("alerts"), dbGet("meta", "settings")]);
    setData({ suppliers, invoices, alerts }); setSettings({ ...DEFAULT_SETTINGS, ...(st || {}) }); setReady(true);
  }
  useEffect(() => { reload().catch(e => { alert("Η αποθήκευση στη συσκευή δεν είναι διαθέσιμη: " + e.message); setReady(true); }); }, []);
  useEffect(() => { if (!toastMsg) return; const t = setTimeout(() => setToastMsg(""), 2600); return () => clearTimeout(t); }, [toastMsg]);

  const supById = useMemo(() => Object.fromEntries(data.suppliers.map(s => [s.id, s])), [data.suppliers]);
  const products = useMemo(() => buildProducts(data.invoices), [data.invoices]);
  const prodByKey = useMemo(() => Object.fromEntries(products.map(p => [p.key, p])), [products]);
  const alerts = useMemo(() => {
    const readSet = new Set(settings.readAlerts || []);
    return buildAlerts(products, Number(settings.threshold) || 0).map(a => ({ ...a, read: readSet.has(a.id) }));
  }, [products, settings.threshold, settings.readAlerts]);
  const vdata = useMemo(() => ({ ...data, alerts }), [data, alerts]);
  const unread = alerts.filter(a => !a.read).length;

  function go(p) { setPage(p); setSupplierId(null); window.scrollTo(0, 0); }
  function openSupplier(id) { setInvoiceId(null); setProductKeyOpen(null); setPage("suppliers"); setSupplierId(id); window.scrollTo(0, 0); }

  async function saveDraft(draft, files) {
    const afm = draft.supplier.afm.replace(/\D/g, "");
    let sup = (afm && data.suppliers.find(s => s.afm === afm)) || (draft.supplier.name && data.suppliers.find(s => norm(s.name) === norm(draft.supplier.name))) || { id: uid(), createdAt: Date.now(), notes: "" };
    const pick = k => (draft.supplier[k] || "").trim() || sup[k] || "";
    sup = { ...sup, afm: afm || sup.afm || "", name: pick("name") || "Άγνωστος προμηθευτής", doy: pick("doy"), address: pick("address"), phone: pick("phone"), email: pick("email") };
    await dbPut("suppliers", sup);
    const fileIds = [];
    for (const f of files) { const id = uid(); await dbPut("files", { id, blob: f.blob, mimeType: f.mimeType }); fileIds.push(id); }
    const lines = draft.lines.filter(l => (l.description || "").trim() || (l.code || "").trim()).map(l => ({
      code: (l.code || "").trim(), description: (l.description || "").trim(), quantity: parseNum(l.quantity), unit: (l.unit || "").trim(),
      unitPrice: parseNum(l.unitPrice), discountPct: parseNum(l.discountPct), net: parseNum(l.net), vatPct: parseNum(l.vatPct),
    }));
    const net = parseNum(draft.invoice.net) ?? (lines.length ? Math.round(sum(lines, l => l.net) * 100) / 100 : null);
    const vat = parseNum(draft.invoice.vat);
    const total = parseNum(draft.invoice.total) ?? (net != null && vat != null ? net + vat : net);
    const inv = {
      id: uid(), supplierId: sup.id, number: draft.invoice.number.trim(), date: draft.invoice.date || todayISO(), type: draft.invoice.type.trim(), mark: draft.invoice.mark.trim(),
      net, vat, total, paymentMethod: draft.invoice.paymentMethod.trim(), dueDate: draft.invoice.dueDate || "", lines, fileIds, notes: draft.notes || "", createdAt: Date.now(),
    };
    await dbPut("invoices", inv);
    await reload();
    const newAlerts = buildAlerts(buildProducts([...data.invoices, inv]), Number(settings.threshold) || 0).filter(a => a.invoiceId === inv.id);
    return { inv, alerts: newAlerts };
  }

  async function deleteInvoice(id) {
    const inv = data.invoices.find(i => i.id === id);
    if (inv) for (const f of inv.fileIds || []) await dbDel("files", f);
    await dbDel("invoices", id);
    for (const a of data.alerts.filter(a => a.invoiceId === id)) await dbDel("alerts", a.id);
    setInvoiceId(null); await reload(); setToastMsg("Το τιμολόγιο διαγράφηκε");
  }
  async function markAllRead() { await dbPut("meta", { ...settings, id: "settings", readAlerts: alerts.map(a => a.id) }); await reload(); }
  async function saveSettings(s) { await dbPut("meta", { ...s, id: "settings" }); await reload(); }
  async function updateSupplier(s) { await dbPut("suppliers", s); await reload(); setToastMsg("Αποθηκεύτηκε"); }

  if (!ready) return <div className="empty" style={{ paddingTop: 120 }}><div className="spin" /></div>;

  const openInv = invoiceId && data.invoices.find(i => i.id === invoiceId);
  const openProd = productKeyOpen && prodByKey[productKeyOpen];
  const supplier = supplierId && supById[supplierId];

  let content;
  if (page === "scan") content = <ScanPage data={vdata} settings={settings} saveDraft={saveDraft} goInvoice={id => setInvoiceId(id)} goAlerts={() => go("alerts")} />;
  else if (page === "invoices") content = <InvoicesPage data={vdata} supById={supById} openInvoice={setInvoiceId} />;
  else if (page === "suppliers") content = supplier
    ? <SupplierDetail key={supplier.id} supplier={supplier} data={vdata} products={products} supById={supById} openInvoice={setInvoiceId} openProduct={setProductKeyOpen} onBack={() => setSupplierId(null)} onUpdate={updateSupplier} />
    : <SuppliersPage data={vdata} openSupplier={openSupplier} />;
  else if (page === "products") content = <ProductsPage products={products} supById={supById} openProduct={setProductKeyOpen} />;
  else if (page === "alerts") content = <AlertsPage data={vdata} supById={supById} settings={settings} openProduct={setProductKeyOpen} markAllRead={markAllRead} />;
  else if (page === "settings") content = <SettingsPage settings={settings} saveSettings={saveSettings} data={vdata} reload={reload} toast={setToastMsg} />;
  else content = <Dashboard data={vdata} supById={supById} products={products} go={go} openSupplier={openSupplier} openProduct={setProductKeyOpen} />;

  return (
    <>
      <div className="mtop">
        <div className="brand">Τιμολόγια <small>beta</small></div><span className="sp" />
        <button className="icbtn" onClick={() => go("alerts")} aria-label="Ειδοποιήσεις"><Icon n="bell" />{unread > 0 && <span className="dot" />}</button>
        <button className="icbtn" onClick={() => go("settings")} aria-label="Ρυθμίσεις"><Icon n="gear" /></button>
      </div>
      <div className="app">
        <aside className="side">
          <div className="brand">Τιμολόγια <small>beta</small></div>
          <button className="nav scanbtn" onClick={() => go("scan")}><Icon n="cam" /> Νέο τιμολόγιο</button>
          {NAV.map(([k, l, ic]) => (
            <button key={k} className={"nav" + (page === k ? " on" : "")} onClick={() => go(k)}><Icon n={ic} /> {l}{k === "alerts" && unread > 0 && <span className="cnt">{unread}</span>}</button>
          ))}
          <span className="sp" />
          {settings.businessName && <div className="mut sm" style={{ padding: "0 10px" }}>{settings.businessName}</div>}
        </aside>
        <main className="main">{content}</main>
      </div>
      <nav className="bnav">
        {[["home", "Αρχική", "home"], ["invoices", "Τιμολόγια", "doc"], ["scan", "Σάρωση", "cam"], ["suppliers", "Προμηθ.", "truck"], ["products", "Είδη", "box"]].map(([k, l, ic]) => (
          <button key={k} className={(page === k ? "on" : "") + (k === "scan" ? " big" : "")} onClick={() => go(k)}>
            {k === "scan" ? <span className="c"><Icon n={ic} /></span> : <Icon n={ic} />}{l}
          </button>
        ))}
      </nav>
      {openInv && <InvoiceModal inv={openInv} supplier={supById[openInv.supplierId]} onClose={() => setInvoiceId(null)} onDelete={deleteInvoice} openSupplier={openSupplier} />}
      {openProd && <ProductModal product={openProd} supplier={supById[openProd.supplierId]} onClose={() => setProductKeyOpen(null)} openInvoice={id => { setProductKeyOpen(null); setInvoiceId(id); }} />}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
